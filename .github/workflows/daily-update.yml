name: Daily Data Update
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '数据拉取模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
      data_source:
        description: '数据来源'
        required: true
        default: 'akshare'
        type: choice
        options:
          - akshare
          - local
      symbol:
        description: '品种，用逗号分隔，空=全部'
        required: false
        default: ''
        type: string
      year:
        description: '日期范围: 2026(全年) / 202606(6月) / 20260626(单日)'
        required: false
        default: '0'
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: inputs.data_source == 'akshare'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (AKShare)
        if: inputs.data_source == 'akshare'
        run: pip install -r scripts/requirements.txt

      - name: Fetch data from AKShare
        if: inputs.mode == 'full' && inputs.data_source == 'akshare'
        run: python scripts/fetch_data.py --output data.json --year ${{ inputs.year }} --symbol "${{ inputs.symbol }}"
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          D1_API_KEY: ${{ secrets.D1_API_KEY }}

      - name: Upload (from data/ directory)
        if: inputs.data_source == 'local'
        run: |
          SYM_FLAG="${{ inputs.symbol }}"
          YR_FLAG="${{ inputs.year }}"
          python scripts/upload_to_d1.py --data-dir data ${SYM_FLAG:+--symbol "$SYM_FLAG"} ${YR_FLAG:+--year "$YR_FLAG"}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          D1_API_KEY: ${{ secrets.D1_API_KEY }}

      - name: Purge CDN cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["api.starrysay.com/api/"]}'
