  ZN: { name: '锌',       mult: 5 },
  PB: { name: '铅',       mult: 5 },

  HC: { name: '热卷',     mult: 10 },
  NI: { name: '镍',       mult: 1 },
  SN: { name: '锡',       mult: 1 },
  AU: { name: '黄金',     mult: 1000 },

  RU: { name: '橡胶',     mult: 10 },

  SC: { name: '原油',     mult: 1000 },
  NR: { name: '20号胶',   mult: 10 },
};
let ALL_DATA = {};
let defaultParams = {

  minPct: 0.1,
  maxPos: 75,
  margin: 15,
  beTh: 0.9,
  entryStop: 2.5,

};

async function loadData(symbol) {
  const status = document.getElementById('dataStatus');
  status.textContent = '加载 ' + symbol + ' ...';
  try {
    const resp = await fetch(API_BASE + symbol + '.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.length === 0) {
      status.textContent = symbol + ' 数据为空';
      return [];
    }
    status.textContent = symbol + ' ' + data[0].d + ' ~ ' + data[data.length - 1].d + ' (' + data.length + '条)';
    return data;
  } catch (e) {
    status.textContent = '加载失败: ' + e.message;
    console.error(e);
    return null;
  }
}

async function loadAllData() {
  const status = document.getElementById('dataStatus');
  const sel = document.getElementById('symbol');
  status.textContent = '加载品种列表...';

  // 本地 data/index.json 获取品种列表
  let symbols;
  try {
    const resp = await fetch(API_BASE + 'index.json');
    const result = await resp.json();
    symbols = (result.symbols || []).filter(s => SYM_CFG[s]);
  } catch {
    symbols = Object.keys(SYM_CFG);
  }

  // 动态填充品种选择器
  sel.innerHTML = '';
  for (const sym of symbols) {
    const opt = document.createElement('option');
    opt.value = sym;
    opt.textContent = SYM_CFG[sym].name + ' (' + sym + ')';
    sel.appendChild(opt);
  }

  // 恢复上次选中的品种，否则默认 PTA
  const saved = localStorage.getItem('maxpain_symbol');
  if (saved && symbols.includes(saved)) {
    sel.value = saved;
  } else if (symbols.includes('TA')) {
    sel.value = 'TA';
  }

  // 只加载第一个品种的数据
  const firstSym = sel.value;
  const data = await loadData(firstSym);
  if (data) {
    ALL_DATA[firstSym] = data;
    status.textContent = symbols.length + ' 品种可选';
    return true;
  }
  status.textContent = '数据加载失败';
  return false;
}

async function switchSymbol() {
  const sym = document.getElementById('symbol').value;
  localStorage.setItem('maxpain_symbol', sym);
  if (!ALL_DATA[sym]) {
    document.getElementById('dataStatus').textContent = '加载 ' + sym + ' ...';
    const data = await loadData(sym);
    if (data) ALL_DATA[sym] = data;
  }
  const d = ALL_DATA[sym];
  if (d) {
    document.getElementById('p_start').value = d[0].d;
    document.getElementById('p_end').value = new Date().toISOString().slice(0, 10);
  }
  await loadParams(sym);
  runBacktest();
}

function emaDirection(arr, period, buffer) {
  if (!arr || arr.length < period) return { dir: null };
  const vals = arr.slice(-period);
  let ema = vals[0];
  const k = 2 / (period + 1);
  for (let i = 1; i < vals.length; i++) { ema = vals[i] * k + ema * (1 - k); }
  const last = vals[vals.length - 1];
  if (last > ema * (1 + buffer)) return { dir: 'up' };
  if (last < ema * (1 - buffer)) return { dir: 'down' };
  return { dir: null };
}

function emaChange(arr, period) {
  if (!arr || arr.length < period * 2) return null;
  const k = 2 / (period + 1);
  const cu = arr.slice(-period - 1);
  let ce = cu[0];
  for (let i = 1; i < cu.length; i++) ce = cu[i] * k + ce * (1 - k);
  const pv = arr.slice(-period * 2 - 1, arr.length - period);
  let pe = pv[0];
  for (let i = 1; i < pv.length; i++) pe = pv[i] * k + pe * (1 - k);
  return (ce - pe) / Math.abs(pe);
}

function linearProjected(arr, lookback) {
  if (!arr || arr.length < lookback + 1) return null;
  const a = arr.slice(-lookback - 1);
  const n = a.length;
  let sx = 0, sy = 0, sxy = 0, sx2 = 0;
  for (let i = 0; i < n; i++) {
    sx += i; sy += a[i]; sxy += i * a[i]; sx2 += i * i;
  }
  const slope = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
  return slope * (n - 1);
}
function calcATR(data, period) {
  const atr = new Float64Array(data.length);
  atr.fill(NaN);
  if (data.length < period + 1) return atr;
  let sum = 0;
  for (let i = 1; i <= period; i++) {
    const p = data[i - 1], c = data[i];
    sum += Math.max(c.h - c.l, Math.abs(c.h - p.c), Math.abs(c.l - p.c));
  }
  atr[period] = sum / period;
  for (let i = period + 1; i < data.length; i++) {
    const p = data[i - 1], c = data[i];
    const tr = Math.max(c.h - c.l, Math.abs(c.h - p.c), Math.abs(c.l - p.c));
    atr[i] = (atr[i - 1] * (period - 1) + tr) / period;
  }
  return atr;
}
function computeNextDirPred(fullData, params) {
  const n = fullData.length, momDays = params.momDays || 3;
  const preds = new Array(n).fill(null);
  for (let i = 0; i < n; i++) {
    const mpHist = fullData.slice(0, i + 1).map(r => r.mp);
    const { dir: td } = emaDirection(mpHist, params.lookback, params.minPct);
    let nd = null;
    if (td === 'up') nd = 'long';
    else if (td === 'down') nd = 'short';
    if (nd && mpHist.length > momDays + 1) {
      const cm = mpHist[mpHist.length - 1], pm = mpHist[mpHist.length - 1 - momDays];
      if ((nd === 'long' && cm <= pm) || (nd === 'short' && cm >= pm)) nd = null;
    }
    if (nd) {
      const r = fullData[i];
      if ((nd === 'long' && r.bec !== null && r.c >= r.bec) || (nd === 'short' && r.bep !== null && r.c <= r.bep)) nd = null;
    }
    if (nd && i > 0) {
      const prev = fullData[i-1], cur = fullData[i];
      if (nd === 'long' && prev.bec != null && cur.bec != null && prev.bec > prev.mp && cur.bec <= cur.mp) nd = null;
      if (nd === 'short' && prev.bep != null && cur.bep != null && prev.bep < prev.mp && cur.bep >= cur.mp) nd = null;
    }
    preds[i] = nd;
  }
  return preds;
}
function _runCore(data, fullData, firstIdx, params, mult, nextDirPred, btStart, btEnd) {
  btStart = btStart || 0;
  btEnd = btEnd || data.length;
  const { lookback: LBK, minPct: MIN_PCT, maxPos: MAX_POS, margin: MR, beTh: BE_TH, entryStop: ENTRY_STOP, atrPeriod: ATR_PERIOD, atrMult: ATR_MULT, lockPct: LOCK_PCT, capital: CAP, capLimit: CAP_LIMIT, skipCount: SKIP, momDays } = params;
  const preStart = Math.max(0, firstIdx - LBK);
  let eq = CAP, peakEq = CAP, maxDd = 0, pos = null;
  const mpHist = [], priceHist = [], trades = [], eqCurve = [{ d: data[0].d, eq: CAP }], stopCurve = [];
  let skipLong = 0, skipShort = 0, skipCount = SKIP;
  let prevCo = null, prevPo = null;
  let prevClose = firstIdx > 0 ? fullData[firstIdx - 1].c : data[0].c;
  let prevMp = firstIdx > 0 ? fullData[firstIdx - 1].mp : data[0].mp;
  let prevBec = null, prevBep = null, prevIvs = null;
  for (let i = preStart; i < firstIdx; i++) { mpHist.push(fullData[i].mp); priceHist.push(fullData[i].c); }
  const fullAtr = calcATR(fullData, ATR_PERIOD);

  for (let _di = 0; _di < data.length; _di++) {
    const row = data[_di];

    let reason = '';

        if (currDir !== pos.entryTrend && currDir !== null) { exitPx = px; reason = '方向反转'; }

      if (!exitPx) {
        const atrVal = fullAtr[_fullIdx];
        if (pos.direction === 'long') {
          let stop;
          if (pos.beActive) { const pp = pos.peakPx - pos.entryPx; stop = pos.entryPx + pp * LOCK_PCT; }
          else {
            const atrStop = isNaN(atrVal) ? prevClose * (1 - 0.005) : prevClose - atrVal * ATR_MULT;
            stop = Math.max(atrStop, pos.entryPx * (1 - ENTRY_STOP));
          }
          if (lo < stop) { exitPx = stop; reason = stop === pos.entryPx ? '保本出场' : (stop > pos.entryPx ? '追踪止盈' : '止损'); }
        } else {
          let stop;
          if (pos.beActive) { const pp = pos.entryPx - pos.peakPx; stop = pos.entryPx - pp * LOCK_PCT; }
          else {
            const atrStop = isNaN(atrVal) ? prevClose * (1 + 0.005) : prevClose + atrVal * ATR_MULT;
            stop = Math.min(atrStop, pos.entryPx * (1 + ENTRY_STOP));
          }
          if (hi > stop) { exitPx = stop; reason = stop === pos.entryPx ? '保本出场' : (stop < pos.entryPx ? '追踪止盈' : '止损'); }
        }
      }
      if (exitPx !== null) {
        const pnl = (exitPx - pos.entryPx) * pos.qty * mult * (pos.direction === 'long' ? 1 : -1);
        trades.push({ entry: pos.entryDate, exit: d, entryPx: pos.entryPx, exitPx, dir: pos.direction, qty: pos.qty, pnl: pnl - 10 * pos.qty * 2, reason, entryReason: pos.entryReason, hold: (new Date(d) - new Date(pos.entryDate)) / 864e5 });
        eq += pnl - 10 * pos.qty * 2;
        if (pnl - 10 * pos.qty * 2 > 0) {
          if (pos.direction === 'long') skipShort = skipCount; else skipLong = skipCount;
        }
        pos = null;
      }
    }

    if (!pos && (reason === '' || reason === '方向反转')) {

	      // åªå¨åæµåºé´åå¼ä»
	      if (_di < btStart || _di >= btEnd) td = null;

        }
      }
      if (td) {
          const dn = op * mult * MR;
          if (dn > 0) {
            let alloc = eq * MAX_POS;
            if (CAP_LIMIT > 0) alloc = Math.min(alloc, CAP_LIMIT);
            const qty = Math.floor(alloc / dn);
            if (qty >= 1) {
              pos = { direction: td, entryPx: op, entryDate: d, qty, entryReason: td === 'long' ? '趋势多' : '趋势空', peakPx: op, beActive: false, entryTrend: td === 'long' ? 'up' : 'down' };
              // 入场当天用固定百分比止损（ENTRY_STOP）
              if (td === 'long') {
                const stop2 = prevClose * (1 - ENTRY_STOP);
                if (lo < stop2) {
                  const pnl2 = (stop2 - op) * qty * mult;
                  trades.push({ entry: d, exit: d, entryPx: op, exitPx: stop2, dir: td, qty, pnl: pnl2 - 10 * qty * 2, reason: stop2 === op ? '保本出场' : '止损', entryReason: '趋势多', hold: 0 });
                  eq += pnl2 - 10 * qty * 2;
                  pos = null;
                }
              } else {
                const stop2 = prevClose * (1 + ENTRY_STOP);
                if (hi > stop2) {
                  const pnl2 = (op - stop2) * qty * mult;
                  trades.push({ entry: d, exit: d, entryPx: op, exitPx: stop2, dir: td, qty, pnl: pnl2 - 10 * qty * 2, reason: stop2 === op ? '保本出场' : '止损', entryReason: '趋势空', hold: 0 });
                  eq += pnl2 - 10 * qty * 2;
                  pos = null;
                }
              }
            }
          }
      }
    }

    peakEq = Math.max(peakEq, eq);
    maxDd = Math.max(maxDd, (peakEq - eq) / peakEq * 100);
    if (pos) {
      if (pos.direction === 'long' && px > pos.peakPx) {
        pos.peakPx = px;
        if (BE_TH > 0 && LOCK_PCT > 0 && !pos.beActive && pos.peakPx >= pos.entryPx * (1 + BE_TH / LOCK_PCT)) pos.beActive = true;
      } else if (pos.direction === 'short' && px < pos.peakPx) {
        pos.peakPx = px;
        if (BE_TH > 0 && LOCK_PCT > 0 && !pos.beActive && pos.peakPx <= pos.entryPx * (1 - BE_TH / LOCK_PCT)) pos.beActive = true;
      }
    }
    if (pos) {
      const _breakLevel = pos.direction === 'long' ? prevBep : prevBec;
      const atrVal = fullAtr[_fullIdx];
      let _s;
      if (pos.beActive) {
        const _pp = pos.direction === 'long' ? pos.peakPx - pos.entryPx : pos.entryPx - pos.peakPx;
        _s = pos.direction === 'long' ? pos.entryPx + _pp * LOCK_PCT : pos.entryPx - _pp * LOCK_PCT;
      } else {
        const atrStop = pos.direction === 'long'
          ? (isNaN(atrVal) ? prevClose * (1 - 0.005) : prevClose - atrVal * ATR_MULT)
          : (isNaN(atrVal) ? prevClose * (1 + 0.005) : prevClose + atrVal * ATR_MULT);
        _s = pos.direction === 'long'
          ? Math.max(atrStop, pos.entryPx * (1 - ENTRY_STOP))
          : Math.min(atrStop, pos.entryPx * (1 + ENTRY_STOP));
      }
      stopCurve.push({ d, stop: _s, breakLevel: _breakLevel });
    } else {
      stopCurve.push({ d, stop: null, breakLevel: null });
    }
    mpHist.push(mp); priceHist.push(px);
    prevCo = co; prevPo = po;
    prevClose = px;
    prevMp = mp;
    prevBec = bec; prevBep = bep; prevIvs = ivs;
    eqCurve.push({ d, eq });
  }
  return { trades, eq, eqCurve, stopCurve, peakEq, maxDd, CAP, openPos: pos };
}

      ' + recent.map(t => '<tr><td>' + t.entry + '</td><td>' + t.exit + '</td><td>' + dirText(t.dir) + '</td><td class="num">' + t.qty + '</td><td class="num">' + t.entryPx.toFixed(0) + '</td><td class="num">' + t.exitPx.toFixed(0) + '</td><td class="num ' + cls(t.pnl) + '">' + fmt(Math.round(t.pnl)) + '</td><td>' + t.reason + '</td><td class="num">' + Math.round(t.hold) + '天</td></tr>').join('') + '</table></div>';

function genAnalysis(data, fullData, params, nextDirPred, trades, targetIdx) {
  const n = data.length;
  const idx = targetIdx !== undefined ? targetIdx : n - 1;
  const r = data[idx];
  const mpHist = data.slice(0, idx + 1).map(x => x.mp);
  const { dir: trendDir } = emaDirection(mpHist, params.lookback, params.minPct);
  const lastPredIdx = fullData.findIndex(x => x.d === r.d);
  const nd = lastPredIdx >= 0 ? nextDirPred[lastPredIdx] : null;
  const prevR = idx > 0 ? data[idx - 1] : null;
  const oiTotal = r.co + r.po;
  const prevOiTotal = prevR ? prevR.co + prevR.po : 0;
  const oiDrop = prevOiTotal > 0 && oiTotal < prevOiTotal * 0.5;

  const factors = [];
  let bullCount = 0, bearCount = 0;
  function addFactor(label, isBull, weight) {
    factors.push({ label, isBull, weight: weight || 1 });
    if (isBull) bullCount += weight || 1; else bearCount += weight || 1;
  }
  if (r.gex != null) addFactor('GEX ' + (r.gex > 0 ? '转正' : '为负') + '(' + Math.round(r.gex/1e6) + 'M)', r.gex > 0);
  if (r.vr != null) addFactor('量比 ' + r.vr.toFixed(2) + (r.vr > 1.5 ? '(看涨活跃)' : r.vr < 0.7 ? '(看跌活跃)' : ''), r.vr > 1);
  if (r.ivs != null) addFactor('IV偏斜 ' + r.ivs.toFixed(4) + (r.ivs < 0 ? '(call>put偏多)' : '(put>call偏空)'), r.ivs < 0);
  const spread = r.c - r.mp;
  addFactor('价格' + (spread > 0 ? '高于' : '低于') + 'MP ' + Math.abs(spread).toFixed(0) + '点', spread > 0);
  addFactor('MP趋势 ' + (trendDir === 'up' ? '偏多' : trendDir === 'down' ? '偏空' : '震荡'), trendDir === 'up');
  if (nd) addFactor('明日方向 ' + (nd === 'long' ? '多' : '空'), nd === 'long');
  if (r.bec != null && r.bep != null) {
    const aboveBec = r.c > r.bec;
    const belowBep = r.c < r.bep;
    if (aboveBec) addFactor('价格在看涨BE上方(突破)', true, 2);
    else if (belowBep) addFactor('价格在看跌BE下方(破位)', false, 2);
    else addFactor('价格在BE区间[' + r.bep.toFixed(0) + '~' + r.bec.toFixed(0) + ']', r.c > (r.bep + r.bec) / 2);
  }
  const skew = (r.co - r.po) / (r.co + r.po + 1e-10);
  const prevSkew = prevR ? (prevR.co - prevR.po) / (prevR.co + prevR.po + 1e-10) : 0;
  if (prevR) addFactor('OI偏度 ' + (skew > 0 ? '看涨OI占优' : '看跌OI占优') + '(变化' + (skew - prevSkew >= 0 ? '+' : '') + (skew - prevSkew).toFixed(3) + ')', skew > 0);
  const prevCross = idx > 0 ? data[idx - 1] : null;
  if (prevCross && r.bec != null && prevCross.bec != null && r.mp != null && prevCross.mp != null) {
    if (prevCross.bec > prevCross.mp && r.bec <= r.mp) addFactor('看涨BE下穿MP(看跌信号)', false, 2);
    if (prevCross.bep < prevCross.mp && r.bep >= r.mp) addFactor('看跌BE上穿MP(看涨信号)', true, 2);
  }
  if (oiDrop) factors.push({ label: '期权换月,MP信号可靠性降低', isBull: null });

  const totalW = bullCount + bearCount;
  const sentiment = totalW > 0 ? (bullCount / totalW * 100) : 50;
  const sentClass = sentiment >= 60 ? 'pos' : sentiment <= 40 ? 'neg' : '';
  const sentLabel = sentiment >= 60 ? '偏多' : sentiment <= 40 ? '偏空' : '中性';

  // 明日推演
  const projFactors = [];
  if (trendDir === 'up' && r.gex > 0 && r.vr > 1) projFactors.push('GEX转正+量比偏多,短期有上行动力');
  if (trendDir === 'up' && spread < 0) projFactors.push('MP趋势向上但价格在MP下方,有回归引力');
  if (trendDir === 'down' && r.gex < 0 && r.vr < 1) projFactors.push('GEX为负+量比偏空,短期有下行压力');
  if (trendDir === 'down' && spread > 0) projFactors.push('MP趋势向下但价格在MP上方,有回归引力');
  if (nd === 'long') projFactors.push('明日方向做多,系统有开仓信号');
  if (nd === 'short') projFactors.push('明日方向做空,系统有开仓信号');
  if (nd === null && trendDir) projFactors.push('明日方向无信号,系统不会新开仓');
  if (oiDrop) projFactors.push('期权换月期间,MP数据不稳定,建议等待新链积累足够OI');
  if (r.bec != null && r.bep != null) {
    if (r.c < r.bep) projFactors.push('价格跌破看跌BE,短期可能加速下行');
    if (r.c > r.bec) projFactors.push('价格突破看涨BE,短期可能加速上行');
  }
  if (!projFactors.length) projFactors.push('多空因素均衡,等待市场选择方向');

  // 后续关注
  const watchItems = [];
  watchItems.push('MP趋势是否持续' + (trendDir === 'up' ? '向上' : trendDir === 'down' ? '向下' : ''));
  if (oiDrop) watchItems.push('期权新链OI积累速度,MP值逐渐稳定后信号才有意义');
  if (r.bec != null && r.mp != null) watchItems.push('BEC(' + r.bec.toFixed(0) + ')与MP(' + r.mp + ')的相对位置');
  if (r.bep != null && r.mp != null) watchItems.push('BEP(' + r.bep.toFixed(0) + ')与MP(' + r.mp + ')的相对位置');
  watchItems.push('收盘能否站稳MP(' + r.mp + ')以上,确认价格回归');
  if (r.vr != null) watchItems.push('量比是否持续>1,验证看涨情绪延续性');

  const factorHtml = factors.map(f =>
    '<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px;">' +
    (f.isBull === null
      ? '<span style="color:#e8c84a;">~</span><span style="color:#8395a7;">' + f.label + '</span>'
      : '<span style="color:' + (f.isBull ? '#5cd85a' : '#ff6b6b') + ';">' + (f.isBull ? '+' : '-') + '</span><span>' + f.label + '</span>'
    ) + '</div>'
  ).join('');

  // 关键事件(近10天)
  const evLookback = 10;
  const evStart = Math.max(0, idx + 1 - evLookback);
  const evEnd = idx + 1;
  const evTradeMap = {};
  if (trades) {
    for (const t of trades) {
      if (!evTradeMap[t.entry]) evTradeMap[t.entry] = [];
      evTradeMap[t.entry].push({ type: 'entry', dir: t.dir });
      if (!evTradeMap[t.exit]) evTradeMap[t.exit] = [];
      evTradeMap[t.exit].push({ type: 'exit', dir: t.dir });
    }
  }
  const evRows = [];
  for (let i = evStart; i < evEnd; i++) {
    const d = data[i];
    const sub = data.slice(0, i + 1).map(x => x.mp);
    const { dir: td } = emaDirection(sub, params.lookback, params.minPct);
    const dayTrades = evTradeMap[d.d] || [];
    const evs = [];
    for (const t of dayTrades) evs.push(t.type === 'entry' ? '开' : '平');
    if (i > 0) {
      const p = data[i - 1];
      if (p.bec != null && d.bec != null && p.bec > p.mp && d.bec <= d.mp) evs.push('BEC↓MP');
      if (p.bep != null && d.bep != null && p.bep < p.mp && d.bep >= d.mp) evs.push('BEP↑MP');
      const mpDelta = d.mp - p.mp;
      if (Math.abs(mpDelta) / (Math.abs(p.mp) || 1) > 0.03) evs.push('MP变' + (mpDelta > 0 ? '↑' : '↓'));
      const curOi = d.co + d.po;
      const prevOi = p.co + p.po;
      if (prevOi > 0 && curOi < prevOi * 0.5) evs.push('期权换月');
      if (d.nc != null && p.nc != null) {
        const ncChg = Math.abs(d.nc - p.nc) / (p.nc || 1);
        const cChg = Math.abs(d.c - p.c) / (p.c || 1);
        if (ncChg > cChg * 5 && ncChg > 0.02) evs.push('期货换月');
      }
    }
    const nd2 = nextDirPred[fullData.findIndex(x => x.d === d.d)];
    const evSent = td === 'up' ? '多' : td === 'down' ? '空' : '—';
    evRows.push(
      '<tr>' +
        '<td style="font-size:11px;white-space:nowrap;color:#8395a7;">' + d.d.slice(5) + '</td>' +
        '<td class="num" style="font-size:12px;">' + d.c.toFixed(0) + '</td>' +
        '<td class="num" style="font-size:12px;color:#e8c84a;">' + d.mp + '</td>' +
        '<td class="num" style="font-size:11px;' + (evSent === '多' ? 'color:#5cd85a' : evSent === '空' ? 'color:#ff6b6b' : 'color:#576574') + '">' + evSent + '</td>' +
        '<td style="font-size:11px;">' + (nd2 === 'long' ? '<span style="color:#5cd85a;">多</span>' : nd2 === 'short' ? '<span style="color:#ff6b6b;">空</span>' : '<span style="color:#576574;">—</span>') + '</td>' +
        '<td style="font-size:11px;color:#576574;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (evs.length ? evs.join(' ') : '—') + '</td>' +
      '</tr>'
    );
  }
  const evHtml = evRows.join('');

  const projHtml = projFactors.map(p => '<div style="padding:2px 0;font-size:12px;color:#8395a7;">- ' + p + '</div>').join('');
  const watchHtml = watchItems.map(w => '<div style="padding:2px 0;font-size:12px;color:#8395a7;">- ' + w + '</div>').join('');

  return '<div class="chart-wrap" style="margin-top:12px;">' +
    '<h2>' + r.d + ' 分析</h2>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;">' +
      '<div style="flex:1;min-width:160px;">' +
        '<div style="font-size:18px;font-weight:700;' + (sentClass ? 'color:' + (sentiment>=60?'#5cd85a':'#ff6b6b') + ';' : 'color:#8395a7;') + '">' + sentLabel + ' (' + bullCount + '/' + totalW + ')</div>' +
        '<div style="font-size:12px;color:#576574;margin-top:4px;">收盘' + r.c.toFixed(0) + ' | MP' + r.mp + ' | 差价' + (spread>0?'+':'') + spread.toFixed(0) + '</div>' +
      '</div>' +
      '<div style="flex:2;min-width:200px;">' + factorHtml + '</div>' +
    '</div>' +
    '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #2d3436;">' +
      '<div style="font-size:13px;color:#8395a7;font-weight:600;margin-bottom:4px;">明日推演</div>' +
      projHtml +
    '</div>' +
    '<div style="margin-top:8px;padding-top:10px;border-top:1px solid #2d3436;">' +
      '<div style="font-size:13px;color:#8395a7;font-weight:600;margin-bottom:4px;">后续关注</div>' +
      watchHtml +
    '</div>' +
    '<div style="margin-top:8px;padding-top:10px;border-top:1px solid #2d3436;">' +
      '<div style="font-size:13px;color:#8395a7;font-weight:600;margin-bottom:4px;">关键事件(近' + evLookback + '天)</div>' +
      '<div style="max-height:180px;overflow-y:auto;">' +
        '<table style="width:100%;font-size:12px;"><tr>' +
          '<th style="padding:3px 6px;">日期</th><th class="num" style="padding:3px 6px;">收盘</th><th class="num" style="padding:3px 6px;">MP</th><th class="num" style="padding:3px 6px;">趋势</th><th style="padding:3px 6px;">方向</th><th style="padding:3px 6px;">事件</th>' +
        '</tr>' + evHtml + '</table>' +
      '</div>' +
    '</div>' +
  '</div>';
}

  window._lastTrades = trades; window._lastParams = params; window._lastCAP = CAP;
  var capInfo = params.capLimit > 0 ? ' | 封顶' + fmt(params.capLimit) : '';
  status.textContent = '完成 | 数据: ' + data[0].d + ' ~ ' + data[data.length-1].d + ' | ' + trades.length + '笔交易' + capInfo;
  btn.disabled = false;
  setTimeout(function() {
    drawChart(data, trades, params, stopCurve, nextDirPred, openPos);
    drawEquityCurve(eqCurve, CAP);
  }, 0);
}

function dirText(d) { return d === 'long' ? '多' : '空'; }
function fmt(n) { if (n===undefined||n===null) return '-'; return n.toLocaleString('zh-CN'); }
function pct(v) { if (v===undefined||v===null) return '-'; return (v>0?'+':'')+round1(v)+'%'; }
function cls(v) { return v>0?'pos':v<0?'neg':''; }
function round1(v) { return Math.round(v*10)/10; }
function round2(v) { return Math.round(v*100)/100; }

  document.getElementById('p_capital').value = Math.round(p.capital);
  if (p.capLimit !== undefined) document.getElementById('p_cap_limit').value = Math.round(p.capLimit / 10000);
  if (p.lockPct !== undefined) document.getElementById('p_lock_pct').value = p.lockPct;
  if (p.skipCount !== undefined) document.getElementById('p_skip').value = p.skipCount;
  if (p.momDays !== undefined) document.getElementById('p_mom').value = p.momDays;
  if (p.atrPeriod !== undefined) document.getElementById('p_atr_period').value = p.atrPeriod;
  if (p.atrMult !== undefined) document.getElementById('p_atr_mult').value = p.atrMult;
}

async function loadParams(sym) {
  try {
    const resp = await fetch(API_BASE_WORKER + '/api/params?symbol=' + encodeURIComponent(sym) + '&_=' + Date.now());

    if (r.params && r.params.lookback != null) {

        lookback: r.params.lookback,
        minPct: r.params.min_pct,
        maxPos: r.params.max_pos,
        margin: r.params.margin,
        beTh: r.params.be_th,
        entryStop: r.params.entry_stop,
        atrPeriod: r.params.atr_period,
        atrMult: r.params.atr_mult,
        lockPct: r.params.lock_pct,
        capital: r.params.capital,
        capLimit: r.params.cap_limit ? r.params.cap_limit * 10000 : 0,
        skipCount: r.params.skip_count,

      });

function runMonteCarlo() {
  const sym = document.getElementById('symbol').value;
  const cfg = SYM_CFG[sym] || { name: sym, mult: 10 };
  const fullData = ALL_DATA[sym];
  if (!fullData) { alert('数据未加载'); return; }
  const startDate = document.getElementById('p_start').value;
  const endDate = document.getElementById('p_end').value;
  let data = fullData;
  if (startDate) data = data.filter(r => r.d >= startDate);
  if (endDate) data = data.filter(r => r.d <= endDate);
  if (data.length < 2) { alert('数据不足'); return; }
  const firstIdx = fullData.findIndex(r => r.d === data[0].d);
  const params = {
    lookback: parseInt(document.getElementById('p_lookback').value) || defaultParams.lookback,
    minPct: (parseFloat(document.getElementById('p_min_pct').value) || defaultParams.minPct) / 100,
    maxPos: (parseFloat(document.getElementById('p_max_pos').value) || defaultParams.maxPos) / 100,
    margin: (parseFloat(document.getElementById('p_margin').value) || defaultParams.margin) / 100,
    beTh: ((v = parseFloat(document.getElementById('p_be_th').value)) => isNaN(v) ? defaultParams.beTh : v)() / 100,
    entryStop: (parseFloat(document.getElementById('p_entry_stop').value) || defaultParams.entryStop) / 100,
    atrPeriod: parseInt(document.getElementById('p_atr_period').value) || defaultParams.atrPeriod,
    atrMult: parseFloat(document.getElementById('p_atr_mult').value) || defaultParams.atrMult,
    lockPct: (parseFloat(document.getElementById('p_lock_pct').value) || defaultParams.lockPct) / 100,
    capital: parseFloat(document.getElementById('p_capital').value) || defaultParams.capital,
    capLimit: (parseFloat(document.getElementById('p_cap_limit').value) || defaultParams.capLimit) * 10000,
    skipCount: parseInt(document.getElementById('p_skip').value) || defaultParams.skipCount,
    momDays: parseInt(document.getElementById('p_mom').value) || defaultParams.momDays,
  };
  params.mult = cfg.mult;
  const nextDirPred = computeNextDirPred(fullData, params);
  const core = _runCore(data, fullData, firstIdx, params, cfg.mult, nextDirPred);
  const trades = core.trades;
  if (!trades || trades.length < 10) { alert('交易笔数不足（至少10笔）'); return; }
  const result = document.getElementById('result');
  const status = document.getElementById('status');
  status.textContent = '蒙特卡洛模拟中...';

  setTimeout(function() {
    const N = 10000;
    const pnls = trades.map(t => t.pnl);
    const totalActual = pnls.reduce((s, v) => s + v, 0);
    const outcomes = new Float64Array(N);

    for (let iter = 0; iter < N; iter++) {
      let sum = 0;
      for (let i = 0; i < pnls.length; i++) {
        sum += pnls[Math.random() * pnls.length | 0];
      }
      outcomes[iter] = sum;
    }

    outcomes.sort();
    let rank = 0;
    while (rank < N && outcomes[rank] < totalActual) rank++;
    const pctile = (rank / N * 100);

    const minV = outcomes[0], maxV = outcomes[N-1];
    const bins = 40;
    const bucket = new Int32Array(bins);
    const scale = (maxV - minV) || 1;
    const barMax = N * 0.2;
    for (let v of outcomes) {
      const b = Math.min(bins-1, Math.floor((v - minV) / scale * bins));
      bucket[b]++;
    }

    const actualBin = Math.min(bins-1, Math.floor((totalActual - minV) / scale * bins));
    const binW = scale / bins;
    const cap = params.capital;

    let html = '<div class="section"><h2>蒙特卡洛模拟（' + N.toLocaleString() + '次）</h2>\
      <div style="font-size:13px;margin-bottom:12px;color:#8395a7;">\
        实际总PnL: <span class="pos">' + fmt(Math.round(totalActual)) + '</span>\
        | 排名: ' + pctile.toFixed(1) + '百分位\
        | 中位数: ' + fmt(Math.round(outcomes[N/2])) + '\
        | 均值: ' + fmt(Math.round(outcomes.reduce((s,v)=>s+v,0)/N)) + '\
      </div>\
      <div style="font-size:13px;margin-bottom:12px;color:#8395a7;">\
        实际最终权益: <span class="' + (totalActual>0?'pos':'neg') + '">' + fmt(Math.round(cap+totalActual)) + '</span>\
        | P95: ' + fmt(Math.round(outcomes[N*0.95|0])) + '\
        | P05: ' + fmt(Math.round(outcomes[N*0.05|0])) + '\
      </div>\
      <div style="font-size:12px;line-height:18px;font-variant-numeric:tabular-nums;">';

    let firstBin = 0, lastBin = bins-1;
    while (firstBin < bins && bucket[firstBin] === 0) firstBin++;
    while (lastBin >= 0 && bucket[lastBin] === 0) lastBin--;
    const visBins = Math.max(lastBin - firstBin + 1, 1);
    for (let b = firstBin; b <= lastBin; b++) {
      const pctH = Math.max(1, bucket[b] / barMax * 50);
      const isActual = b === actualBin;
      const barColor = isActual ? '#e8c84a' : '#54a0ff';
      const hl = isActual ? ' ◀ 实际' : '';
      const range = fmt(Math.round(minV + b*binW)) + '~' + fmt(Math.round(minV + (b+1)*binW));
      html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:1px;">\
        <span style="width:120px;text-align:right;color:#576574;flex-shrink:0;">' + range + '</span>\
        <div style="height:14px;width:' + pctH + '%;background:' + barColor + ';border-radius:2px;' + (isActual?'border:1px solid #e8c84a;':'') + '"></div>\
        <span style="color:#8395a7;">' + bucket[b] + '</span>' + hl + '\
      </div>';
    }

    html += '</div></div>';
    result.innerHTML = html;
    status.textContent = 'MC完成 | ' + N.toLocaleString() + '次 | 实际在' + pctile.toFixed(1) + '百分位';
  }, 50);
}

const OPT_PARAMS = {
  lookback:   { label: 'Lookback',    range: [5, 60, 1] },
  minPct:     { label: 'Min%',        range: [0.1, 5, 0.1], unit: '%' },
  entryStop:  { label: '入场止损%',   range: [0.5, 5, 0.1], unit: '%' },

  atrMult:    { label: 'ATR倍数',     range: [0.5, 10, 0.5] },
  maxPos:     { label: '仓位%',       range: [5, 100, 5], unit: '%' },
  beTh:       { label: '保本%',       range: [0, 5, 0.1], unit: '%' },
  lockPct:    { label: '锁定%',       range: [10, 75, 5], unit: '%' },
  skipCount:  { label: '跳过次',      range: [0, 5, 1] },

};

function optimizeParam() {
  const sym = document.getElementById('symbol').value;
  const result = document.getElementById('result');
  const status = document.getElementById('status');
  const cfg = SYM_CFG[sym] || { name: sym, mult: 10 };
  const fullData = ALL_DATA[sym];
  if (!fullData) { status.textContent = '数据未加载'; return; }

  const paramKey = document.getElementById('optParam').value;
  const meta = OPT_PARAMS[paramKey];
  const startDate = document.getElementById('p_start').value;
  const endDate = document.getElementById('p_end').value;
  let data = fullData;
  if (startDate) data = data.filter(r => r.d >= startDate);
  if (endDate) data = data.filter(r => r.d <= endDate);
  if (data.length < 2) { status.textContent = '数据不足'; return; }
  const firstIdx = fullData.findIndex(r => r.d === data[0].d);

  const p = {
    lookback: parseInt(document.getElementById('p_lookback').value) || defaultParams.lookback,
    minPct: (parseFloat(document.getElementById('p_min_pct').value) || defaultParams.minPct) / 100,
    maxPos: (parseFloat(document.getElementById('p_max_pos').value) || defaultParams.maxPos) / 100,
    margin: (parseFloat(document.getElementById('p_margin').value) || defaultParams.margin) / 100,
    beTh: ((v = parseFloat(document.getElementById('p_be_th').value)) => isNaN(v) ? defaultParams.beTh : v)() / 100,
    entryStop: (parseFloat(document.getElementById('p_entry_stop').value) || defaultParams.entryStop) / 100,
    atrPeriod: parseInt(document.getElementById('p_atr_period').value) || defaultParams.atrPeriod,
    atrMult: parseFloat(document.getElementById('p_atr_mult').value) || defaultParams.atrMult,
    lockPct: (parseFloat(document.getElementById('p_lock_pct').value) || defaultParams.lockPct) / 100,
    capital: parseFloat(document.getElementById('p_capital').value) || defaultParams.capital,
    capLimit: (parseFloat(document.getElementById('p_cap_limit').value) || defaultParams.capLimit) * 10000,
    skipCount: parseInt(document.getElementById('p_skip').value) || defaultParams.skipCount,
    momDays: parseInt(document.getElementById('p_mom').value) || defaultParams.momDays,
    mult: cfg.mult,
  };

  const [min, max, step] = meta.range;
  status.textContent = '扫描 ' + meta.label + ' (' + min + '~' + max + ' step=' + step + ')...';
  result.innerHTML = '<div class="loading">扫描中...</div>';

  setTimeout(function() {
    const values = [];
    for (let v = min; v <= max + 1e-10; v = Math.round((v + step) * 100) / 100) {
      const pp = Object.assign({}, p);
      if (paramKey === 'minPct') pp.minPct = v / 100;
      else if (paramKey === 'maxPos') pp.maxPos = v / 100;
      else if (paramKey === 'lookback') pp.lookback = v;
      else if (paramKey === 'entryStop') pp.entryStop = v / 100;
      else if (paramKey === 'atrPeriod') pp.atrPeriod = v;
      else if (paramKey === 'atrMult') pp.atrMult = v;
      else if (paramKey === 'beTh') pp.beTh = v / 100;
      else if (paramKey === 'lockPct') pp.lockPct = v / 100;
      else if (paramKey === 'skipCount') pp.skipCount = v;

      const ppNextDir = computeNextDirPred(fullData, pp);
      const core = _runCore(data, fullData, firstIdx, pp, cfg.mult, ppNextDir);
      if (core.trades.length === 0) continue;
      const wins = core.trades.filter(t => t.pnl > 0);
      const losses = core.trades.filter(t => t.pnl <= 0);
      const lossSum = losses.reduce((s, t) => s + Math.abs(t.pnl), 0);
      const winSum = wins.reduce((s, t) => s + t.pnl, 0);
      values.push({
        v, endEq: Math.round(core.eq),
        ret: round1((core.eq / p.capital - 1) * 100),
        trades: core.trades.length,
        wr: round1(wins.length / core.trades.length * 100),
        pf: lossSum > 0 ? round2(winSum / lossSum) : '∞',
        dd: round1(core.maxDd),
        avgPnl: Math.round(core.trades.reduce((s, t) => s + t.pnl, 0) / core.trades.length),
      });
    }

    if (values.length === 0) {
      result.innerHTML = '<div class="error">所有参数值均无交易</div>';
      status.textContent = '无交易'; return;
    }

    values.sort((a, b) => b.endEq - a.endEq);
    const best = values[0];
    const suffix = meta.unit || '';
    const rows = values.map(function(v) {
      return '<tr' + (v === best ? ' style="background:#2d3436;font-weight:700;"' : '') + '>\
        <td class="num">' + v.v + suffix + '</td>\
        <td class="num ' + cls(v.endEq - p.capital) + '">' + fmt(v.endEq) + '</td>\
        <td class="num ' + cls(v.ret) + '">' + pct(v.ret) + '</td>\
        <td class="num">' + v.trades + '</td>\
        <td class="num">' + v.wr + '%</td>\
        <td class="num">' + v.pf + '</td>\
        <td class="num">' + v.dd + '%</td>\
        <td class="num ' + cls(v.avgPnl) + '">' + fmt(v.avgPnl) + '</td>\
      </tr>';
    }).join('');

    result.innerHTML = '<div class="section"><h2>' + meta.label + ' 优化结果（按最终权益排序）</h2>\
      <p style="font-size:12px;color:#576574;margin-bottom:8px;">当前其他参数: lookback=' + p.lookback + ' | min%=' + (p.minPct*100).toFixed(1) + '% | 保本=' + (p.beTh*100).toFixed(1) + '% | 锁定=' + (p.lockPct*100).toFixed(0) + '%</p>\
      <table><tr>\
        <th class="num">' + meta.label + '</th><th class="num">最终权益</th><th class="num">收益</th><th class="num">笔数</th><th class="num">胜率</th><th class="num">盈亏比</th><th class="num">回撤</th><th class="num">均PnL</th>\
      </tr>' + rows + '</table></div>';
    status.textContent = '优化完成 | ' + values.length + '个值 | 最优 ' + meta.label + '=' + best.v + suffix + ' → ' + fmt(best.endEq);
    const idMap = { lookback:'p_lookback', minPct:'p_min_pct', entryStop:'p_entry_stop', atrPeriod:'p_atr_period', atrMult:'p_atr_mult', beTh:'p_be_th', maxPos:'p_max_pos', lockPct:'p_lock_pct', skipCount:'p_skip' };
    const el = document.getElementById(idMap[paramKey]);
    if (meta.unit) el.value = best.v.toFixed(1);
    else el.value = best.v;
  }, 50);
}

function resetParams() {
  if (Object.keys(defaultParams).length > 0) setParamValues(defaultParams);
  const sym = document.getElementById('symbol').value;
  const data = ALL_DATA[sym];
  if (data) {
    document.getElementById('p_start').value = data[0].d;
    document.getElementById('p_end').value = new Date().toISOString().slice(0, 10);
  }
  document.getElementById('p_manual').checked = false;
  toggleManual();
  document.getElementById('p_cap_limit').value = 0;
}

function drawChart(data, trades, params, stopCurve, nextDirPred, openPos) {
  const infoEl = document.getElementById('chartInfo');
  const canvas = document.getElementById('chart');
  if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width;
  const H = 380;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const n = data.length;

  const subCanvas = document.getElementById('subChart');
  var _subGex, _subSkewD, _subMinG, _subMaxG, _subMinS, _subMaxS;
  var _subVr, _subMinV, _subMaxV;
  var _subIv, _subMinIv, _subMaxIv;
  var _subFutVol, _subMinFv, _subMaxFv;
  var _subFutOi, _subMinFoi, _subMaxFoi;
  var _subSkew, _subMinSk, _subMaxSk;
  var _oiChain = null, _oiHoverIdx = -1;
  const subVis = { gex: true, skew: false, vr: false, iv: false, futVol: false, futOi: false, skewVal: false };
  if (subCanvas) {
    subCanvas.width = W * dpr;
    subCanvas.height = 110 * dpr;
    subCanvas.style.width = W + 'px';
    subCanvas.style.height = '110px';
    const sctx = subCanvas.getContext('2d');
    sctx.scale(dpr, dpr);

    _subGex = new Float64Array(n);
    _subSkewD = new Float64Array(n);
    _subVr = new Float64Array(n);
    _subIv = new Float64Array(n);
    _subFutVol = new Float64Array(n);
    _subFutOi = new Float64Array(n);
    _subSkew = new Float64Array(n);
    var _prevSk = null;
    _subMinG = Infinity; _subMaxG = -Infinity;
    _subMinSk = Infinity; _subMaxSk = -Infinity;
    _subMinS = Infinity; _subMaxS = -Infinity;
    _subMinV = Infinity; _subMaxV = -Infinity;
    _subMinIv = Infinity; _subMaxIv = -Infinity;
    _subMinFv = Infinity; _subMaxFv = -Infinity;
    _subMinFoi = Infinity; _subMaxFoi = -Infinity;
    for (let i = 0; i < n; i++) {
      const r = data[i];
      const g = r.gex != null ? r.gex : 0;
      const sk = (r.co - r.po) / (r.co + r.po + 1e-10);
      const sd = _prevSk !== null ? sk - _prevSk : 0;
      const v = r.vr != null ? r.vr : 1;
      const ivv = r.ivs != null ? r.ivs : 0;
      _subGex[i] = g;
      _subSkewD[i] = sd;
      _subVr[i] = v;
      _subIv[i] = ivv;
      _subFutVol[i] = r.fut_vol != null ? r.fut_vol : 0;
      _subFutOi[i] = r.fut_oi != null ? r.fut_oi : 0;
      if (g < _subMinG) _subMinG = g;
      if (g > _subMaxG) _subMaxG = g;
      if (sd < _subMinS) _subMinS = sd;
      if (sd > _subMaxS) _subMaxS = sd;
      if (v < _subMinV) _subMinV = v;
      if (v > _subMaxV) _subMaxV = v;
      if (ivv < _subMinIv) _subMinIv = ivv;
      if (ivv > _subMaxIv) _subMaxIv = ivv;
      const fv = _subFutVol[i];
      if (fv < _subMinFv) _subMinFv = fv;
      if (fv > _subMaxFv) _subMaxFv = fv;
      if (_subSkew[i] < _subMinSk) _subMinSk = _subSkew[i];
      if (_subSkew[i] > _subMaxSk) _subMaxSk = _subSkew[i];
      const foi = _subFutOi[i];
      if (foi < _subMinFoi) _subMinFoi = foi;
      if (foi > _subMaxFoi) _subMaxFoi = foi;
      _prevSk = sk;
    }
    const gr = _subMaxG - _subMinG || 1;
    _subMinG -= gr * 0.1; _subMaxG += gr * 0.1;
    const sr = _subMaxS - _subMinS || 1;
    _subMinS -= sr * 0.1; _subMaxS += sr * 0.1;
    const vr = _subMaxV - _subMinV || 1;
    _subMinV -= vr * 0.1; _subMaxV += vr * 0.1;
    const ivr = _subMaxIv - _subMinIv || 1;
    _subMinIv -= ivr * 0.1; _subMaxIv += ivr * 0.1;
    const fvr = _subMaxFv - _subMinFv || 1;
    _subMinFv -= fvr * 0.1; _subMaxFv += fvr * 0.1;
    const skr = _subMaxSk - _subMinSk || 1;
    _subMinSk -= skr * 0.1; _subMaxSk += skr * 0.1;
    const foir = _subMaxFoi - _subMinFoi || 1;
    _subMinFoi -= foir * 0.1; _subMaxFoi += foir * 0.1;
  }

  const pad = { top: 20, bottom: 36, left: 60, right: 20 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  const tradeByDate = {};
  for (const t of trades) {
    if (!tradeByDate[t.entry]) tradeByDate[t.entry] = [];
    tradeByDate[t.entry].push({ type: 'entry', dir: t.dir, qty: t.qty, pnl: t.pnl, price: t.entryPx, reason: t.entryReason });
    if (!tradeByDate[t.exit]) tradeByDate[t.exit] = [];
    tradeByDate[t.exit].push({ type: 'exit', dir: t.dir, qty: t.qty, pnl: t.pnl, price: t.exitPx, reason: t.reason });
  }

  const initBarW = Math.max(2, cw / n);
  const state = {
    start: Math.max(0, n - Math.ceil(cw / initBarW)),
    barW: initBarW,
    dragging: false,
    dragStartX: 0,
    dragStartIdx: 0,
    hoverIdx: -1,
    pinchDist: 0,
    pinned: false,
    pinnedIdx: -1,
    didDrag: false,
  };

  // 阻止浏览器页面缩放干扰图表操作
  canvas.style.touchAction = 'none';

  function getVisibleCount() { return Math.ceil(cw / state.barW); }

  function updateInfo(idx) {

    const vrDir = row.vr != null ? (row.vr > 1 ? '涨' : row.vr < 1 ? '跌' : '—') : '';
    const subHist = data.slice(0, idx + 1).map(r => r.mp);
    const { dir: trendDir } = emaDirection(subHist, params.lookback, params.minPct);
    const _proj = linearProjected(subHist, params.lookback);

    const _closeHist = data.slice(0, idx + 1).map(r => r.c);
