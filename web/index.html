      <div class="row"><span class="label">IV偏斜 / 量比</span><span class="val" style="font-size:11px"><span class="' + (row.ivs < 0 ? 'pos' : 'neg') + '">' + (row.ivs != null ? row.ivs.toFixed(1) : '-') + '</span> / ' + (row.vr != null ? row.vr.toFixed(2) : '-') + (vrDir ? '<span style="font-size:10px;' + (row.vr>1?'color:#5cd85a':'color:#ff6b6b') + '">' + vrDir + '</span>' : '') + '</span></div>\
      <div class="row"><span class="label">GEX</span><span class="val ' + (row.gex>0?'pos':'neg') + '" style="font-size:11px">' + (row.gex != null ? row.gex.toLocaleString('zh-CN',{maximumFractionDigits:0}) : '-') + '</span></div>\
      <div class="row" style="border-top:1px solid #2d3436;margin-top:4px;padding-top:4px;"><span class="label">明日方向</span><span class="val" style="font-size:13px">' + nextDirText + '</span></div>\
      ' + (stopCurve && stopCurve[idx] && (stopCurve[idx].stop !== null || stopCurve[idx].breakLevel != null) ? '<div class="row"><span class="label">止损/结构</span><span class="val" style="font-size:11px">' + (stopCurve[idx].stop !== null ? '<span style="color:#ff9f43">' + stopCurve[idx].stop.toFixed(0) + '</span>' : '-') + ' / ' + (stopCurve[idx].breakLevel != null ? '<span style="color:#a55eea">' + stopCurve[idx].breakLevel.toFixed(0) + '</span>' : '-') + '</span></div>' : '') + '\
      ' + beCrossHtml + sigHtml + posHtml + '\
    ';
    const aDiv = document.getElementById('candleAnalysis');
    if (aDiv && window._analysisCache && window._analysisCache[idx]) {
      aDiv.innerHTML = window._analysisCache[idx];
    }
  }

  const tradeMarkers = [];
  for (const t of trades) {
    const eIdx = data.findIndex(r => r.d === t.entry);
    const xIdx = data.findIndex(r => r.d === t.exit);
    if (eIdx >= 0) tradeMarkers.push({ idx: eIdx, type: 'entry', dir: t.dir, qty: t.qty, price: t.entryPx });
    if (xIdx >= 0) tradeMarkers.push({ idx: xIdx, type: 'exit', dir: t.dir, qty: t.qty, pnl: t.pnl, price: t.exitPx });
  }
  if (openPos) {
    const oIdx = data.findIndex(r => r.d === openPos.entryDate);
    if (oIdx >= 0) tradeMarkers.push({ idx: oIdx, type: 'entry', dir: openPos.direction, qty: openPos.qty, price: openPos.entryPx, openPos: true });
  }
  tradeMarkers.sort((a, b) => a.idx - b.idx || (a.type === 'entry' ? -1 : 1));

  // BE-MP 交叉标记：看涨BE下穿MP → 下跌，看跌BE上穿MP → 上涨
  const beCrossMarkers = [];
  for (let i = 1; i < n; i++) {
    const prev = data[i-1], cur = data[i];
    if (prev.bec != null && cur.bec != null && prev.bec > prev.mp && cur.bec <= cur.mp) {
      beCrossMarkers.push({ idx: i, type: 'bear' }); // 下跌标记
    }
    if (prev.bep != null && cur.bep != null && prev.bep < prev.mp && cur.bep >= cur.mp) {
      beCrossMarkers.push({ idx: i, type: 'bull' }); // 上涨标记
    }
  }

  function render() {
    const start = Math.max(0, Math.round(state.start));
    const vis = getVisibleCount();
    const end = Math.min(n, start + vis + 1);
    const offset = start * state.barW;

    let minP = Infinity, maxP = -Infinity;
    for (let i = start; i < end; i++) {
      const row = data[i];
      minP = Math.min(minP, row.l, row.mp, row.bec, row.bep, row.nc, row.oc);
      maxP = Math.max(maxP, row.h, row.mp, row.bec, row.bep, row.nc, row.oc);
    }
    const range = maxP - minP || 1;
    const padP = range * 0.05;
    minP -= padP; maxP += padP;
    const scaleY = ch / (maxP - minP);

    function toY(v) { return pad.top + ch - (v - minP) * scaleY; }
    function toX(i) { return pad.left + i * state.barW - offset; }

    ctx.fillStyle = '#0f1923';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#1a2a3a';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const y = pad.top + (ch / 8) * i;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    }

    ctx.fillStyle = '#576574';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 8; i++) {
      const y = pad.top + (ch / 8) * i;
      ctx.fillText((maxP - (range / 8) * i).toFixed(0), pad.left - 6, y + 4);
    }

    if (state.hoverIdx >= start && state.hoverIdx < end) {
      const row = data[state.hoverIdx];
      const hx = toX(state.hoverIdx);
      const hy = toY(row.c);
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = '#8395a7';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(hx, pad.top); ctx.lineTo(hx, pad.top + ch); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad.left, hy); ctx.lineTo(W - pad.right, hy); ctx.stroke();
      ctx.setLineDash([]);
      const prcText = row.c.toFixed(0);
      ctx.font = 'bold 11px sans-serif';
      const prcW = ctx.measureText(prcText).width;
      ctx.fillStyle = '#1a2a3a';
      ctx.fillRect(W - pad.right - prcW - 12, hy - 9, prcW + 14, 18);
      ctx.fillStyle = '#e8c84a';
      ctx.textAlign = 'right';
      ctx.fillText(prcText, W - pad.right - 5, hy + 5);
      const dateText = row.d;
      ctx.font = '11px sans-serif';
      const dateW = ctx.measureText(dateText).width;
      ctx.fillStyle = '#1a2a3a';
      ctx.fillRect(hx - dateW / 2 - 7, pad.top + ch + 2, dateW + 14, 18);
      ctx.fillStyle = '#c8d6e5';
      ctx.textAlign = 'center';
      ctx.fillText(dateText, hx, pad.top + ch + 15);
      ctx.restore();
    }

    if (document.getElementById('t_mp').checked) {
    ctx.strokeStyle = '#e8c84a';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    let mpStarted = false;
    for (let i = start; i < end && i < n; i++) {
      const x = toX(i), y = toY(data[i].mp);
      if (!mpStarted) { ctx.moveTo(x, y); mpStarted = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    }

    // EMA 线
    if (document.getElementById('t_ema').checked) {
    ctx.strokeStyle = '#54a0ff';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.7;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    let emaVal = null, emaStarted = false;
    const emaK = 2 / (params.lookback + 1);
    for (let i = 0; i < end; i++) {
      if (emaVal === null) emaVal = data[i].mp;
      else emaVal = data[i].mp * emaK + emaVal * (1 - emaK);
      if (i >= start) {
        const x = toX(i), y = toY(emaVal);
        if (!emaStarted) { ctx.moveTo(x, y); emaStarted = true; } else ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
    }

    if (document.getElementById('t_bec').checked) {
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    let becStarted = false;
    for (let i = start; i < end && i < n; i++) {
      const x = toX(i), y = toY(data[i].bec);
      if (data[i].bec == null) { becStarted = false; continue; }
      if (!becStarted) { ctx.moveTo(x, y); becStarted = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
    }

    if (document.getElementById('t_bep').checked) {
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    let bepStarted = false;
    for (let i = start; i < end && i < n; i++) {
      const x = toX(i), y = toY(data[i].bep);
      if (data[i].bep == null) { bepStarted = false; continue; }
      if (!bepStarted) { ctx.moveTo(x, y); bepStarted = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
    }

    // 近月连续线
    if (document.getElementById('t_nc').checked) {
    let hasAnyNc = false;
    for (let i = start; i < end && i < n; i++) { if (data[i].nc != null) { hasAnyNc = true; break; } }
    if (hasAnyNc) {
      ctx.strokeStyle = '#a29bfe';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      let ncStarted = false;
      for (let i = start; i < end && i < n; i++) {
        if (data[i].nc == null) { ncStarted = false; continue; }
        const x = toX(i), y = toY(data[i].nc);
        if (!ncStarted) { ctx.moveTo(x, y); ncStarted = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    }

    // 期权对应标的期货价格线
    if (document.getElementById('t_oc').checked) {
    let hasAnyOc = false;
    for (let i = start; i < end && i < n; i++) { if (data[i].oc != null) { hasAnyOc = true; break; } }
    if (hasAnyOc) {
      ctx.strokeStyle = '#f368e0';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      let ocStarted = false;
      for (let i = start; i < end && i < n; i++) {
        if (data[i].oc == null) { ocStarted = false; continue; }
        const x = toX(i), y = toY(data[i].oc);
        if (!ocStarted) { ctx.moveTo(x, y); ocStarted = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    }

    ctx.save();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    const legX = pad.left + 8, legY2 = pad.top + 4;
    let lx = legX, ly = legY2;
    // 第一行：MP + BE线
    ctx.strokeStyle = '#e8c84a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, ly+7); ctx.lineTo(lx+16, ly+7); ctx.stroke();
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('MP', lx+20, ly+11); lx += 50;
    ctx.strokeStyle = '#a29bfe'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, ly+7); ctx.lineTo(lx+16, ly+7); ctx.stroke();
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('近月连续', lx+20, ly+11); lx += 70;
    ctx.strokeStyle = '#f368e0'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, ly+7); ctx.lineTo(lx+16, ly+7); ctx.stroke();
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('期权期货', lx+20, ly+11); lx += 75;
    ctx.setLineDash([4,3]); ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, ly+7); ctx.lineTo(lx+16, ly+7); ctx.stroke(); ctx.setLineDash([]);
    ctx.setLineDash([4,3]); ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, ly+7); ctx.lineTo(lx+16, ly+7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('看涨BE', lx+20, ly+11); lx += 80;
    ctx.setLineDash([4,3]); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, ly+7); ctx.lineTo(lx+16, ly+7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('看跌BE', lx+20, ly+11); lx += 80;
    ctx.strokeStyle = '#54a0ff'; ctx.lineWidth = 1.5; ctx.setLineDash([2,2]); ctx.beginPath(); ctx.moveTo(lx, ly+7); ctx.lineTo(lx+16, ly+7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('EMA', lx+20, ly+11);
    // 第二行：BE-MP交叉
    lx = legX; ly = legY2 + 18;
    const tSz = 6;
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.moveTo(lx+8, ly+tSz+1); ctx.lineTo(lx+4, ly-1); ctx.lineTo(lx+12, ly-1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('BE下穿MP 下跌', lx+20, ly+8); lx += 130;
    ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.moveTo(lx+8, ly-3); ctx.lineTo(lx+4, ly+tSz-1); ctx.lineTo(lx+12, ly+tSz-1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c8d6e5'; ctx.fillText('BE上穿MP 上涨', lx+20, ly+8);
    ctx.restore();

    if (stopCurve && stopCurve.length === n) {
      ctx.save();
      ctx.strokeStyle = '#ff9f43';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      let scStarted = false;
      for (let i = start; i < end && i < n; i++) {
        if (stopCurve[i].stop === null) { scStarted = false; continue; }
        const x = toX(i), y = toY(stopCurve[i].stop);
        if (!scStarted) { ctx.moveTo(x, y); scStarted = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    let tmIdx = 0;
    while (tmIdx < tradeMarkers.length && tradeMarkers[tmIdx].idx < start) tmIdx++;
    for (let i = start; i < end && i < n; i++) {
      const row = data[i];
      const x = toX(i);
      const prevClose = i > 0 ? data[i-1].c : row.c;
      const upColor = row.c >= prevClose;
      const color = upColor ? '#5cd85a' : '#ff6b6b';

      if (data[i].expiry && data[i].expiry === data[i].d) {
        ctx.fillStyle = 'rgba(232,200,74,0.12)';
        ctx.fillRect(x - state.barW * 2, pad.top, state.barW * 4, ch);
      }

      if (i === state.hoverIdx) {
        ctx.fillStyle = '#ffffff08';
        ctx.fillRect(x - state.barW / 2, pad.top, state.barW, ch);
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1, state.barW * 0.2);
      ctx.beginPath();
      ctx.moveTo(x, toY(row.h)); ctx.lineTo(x, toY(row.l)); ctx.stroke();

      ctx.fillStyle = color;
      const bw = Math.max(1, state.barW * 0.5);
      const bh = Math.max(1, Math.abs(toY(row.c) - toY(prevClose)) || 1);
      const by = upColor ? toY(row.c) : toY(prevClose);
      ctx.fillRect(x - bw / 2, by, bw, bh);

      if (row._manual) {
        ctx.save();
        ctx.strokeStyle = '#54a0ff';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(x - bw / 2, by, bw, bh);
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(x, toY(row.h)); ctx.lineTo(x, toY(row.l)); ctx.stroke();
        ctx.restore();
      }

      while (tmIdx < tradeMarkers.length && tradeMarkers[tmIdx].idx === i) {
        const m = tradeMarkers[tmIdx];
        const isEntry = m.type === 'entry';
        const priceY = toY(m.price);

        const hw = Math.max(10, Math.min(32, state.barW * 0.9));
        const tipSz = Math.max(5, Math.min(10, state.barW * 0.55)); // 更大的尖头

        ctx.save();

        // 价位横线：白色半透明，与K线颜色区分
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(x - hw, priceY); ctx.lineTo(x + hw, priceY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 多→尖朝上▲，空→尖朝下▼，平仓方向与开仓相反
        const isLong = m.dir === 'long';
        const up = isEntry ? isLong : !isLong; // 平仓反向
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 1;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        if (up) {
          ctx.moveTo(x, priceY - 1); // 尖端顶在横线上
          ctx.lineTo(x - tipSz, priceY + tipSz * 1.6);
          ctx.lineTo(x + tipSz, priceY + tipSz * 1.6);
        } else {
          ctx.moveTo(x, priceY + 1); // 尖端顶在横线上
          ctx.lineTo(x - tipSz, priceY - tipSz * 1.6);
          ctx.lineTo(x + tipSz, priceY - tipSz * 1.6);
        }
        ctx.closePath();
        ctx.stroke();

        // 文字标签
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = `bold ${Math.max(9, Math.min(12, state.barW * 0.7))}px sans-serif`;
        ctx.textAlign = 'center';
        const labelOff = tipSz * 1.6 + 11;
        const label = isEntry ? (isLong ? '多' : '空') : '平';
        ctx.fillText(label, x, priceY + (up ? labelOff : -labelOff + 6));
        ctx.restore();
        tmIdx++;
      }
    }

    // BE-MP 交叉标记：▼下跌(红)标在看涨BE上方，▲上涨(绿)标在看跌BE下方
    let bcIdx = 0;
    while (bcIdx < beCrossMarkers.length && beCrossMarkers[bcIdx].idx < start) bcIdx++;
    for (; bcIdx < beCrossMarkers.length && beCrossMarkers[bcIdx].idx < end; bcIdx++) {
      const m = beCrossMarkers[bcIdx];
      const x = toX(m.idx);
      const bearish = m.type === 'bear'; // 看涨BE下穿MP → 下跌
      const beVal = bearish ? data[m.idx].bec : data[m.idx].bep; // 下跌标在bec上方，上涨标在bep下方
      const beY = toY(beVal);
      const sz = Math.max(8, Math.min(14, state.barW * 0.7));
      ctx.save();
      ctx.fillStyle = bearish ? '#e74c3c' : '#2ecc71';
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      const gap = sz * 2.5;
      ctx.beginPath();
      if (bearish) { // ▼ 下跌，尖向下跌方向，标在看涨BE上方
        ctx.moveTo(x, beY - gap * 0.3);          // 尖头（靠近BE线）
        ctx.lineTo(x - sz * 0.8, beY - gap);      // 底部左
        ctx.lineTo(x + sz * 0.8, beY - gap);      // 底部右
      } else { // ▲ 上涨，尖向上涨方向，标在看跌BE下方
        ctx.moveTo(x, beY + gap * 0.3);           // 尖头（靠近BE线）
        ctx.lineTo(x - sz * 0.8, beY + gap);      // 底部左
        ctx.lineTo(x + sz * 0.8, beY + gap);      // 底部右
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 文字标签
      ctx.fillStyle = bearish ? '#e74c3c' : '#2ecc71';
      ctx.font = `bold ${Math.max(8, Math.min(10, state.barW * 0.5))}px sans-serif`;
      ctx.textAlign = 'center';
      const lY = bearish ? beY - gap - 5 : beY + gap + 11;
      ctx.fillText(bearish ? '下跌' : '上涨', x, lY);
      ctx.restore();
    }

    const lastVis = Math.min(end - 1, n - 1);
    ctx.fillStyle = '#e8c84a';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('MP', toX(lastVis) + 4, toY(data[lastVis].mp) - 2);
    if (stopCurve && stopCurve.length === n && stopCurve[lastVis].stop !== null) {
      ctx.fillStyle = '#ff9f43';
      ctx.fillText('止损', toX(lastVis) + 4, toY(stopCurve[lastVis].stop) + 4);
    }
    if (stopCurve && stopCurve.length === n && stopCurve[lastVis].breakLevel != null) {
      ctx.strokeStyle = '#a55eea'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
      ctx.beginPath();
      const bx = toX(lastVis) + 2, by = toY(stopCurve[lastVis].breakLevel);
      ctx.moveTo(bx, by); ctx.lineTo(bx + 20, by);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#a55eea';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('结构', bx + 22, by + 4);
    }

    ctx.fillStyle = '#576574';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    const labelStep = Math.max(1, Math.floor((end - start) / 8));
    for (let i = start; i < end; i += labelStep) {
      ctx.fillText(data[i].d.slice(0, 7), toX(i), H - 10);
    }

    const sbY = H - 4, sbH = 3;
    ctx.fillStyle = '#1a2a3a';
    ctx.fillRect(pad.left, sbY, cw, sbH);
    if (state.barW * n > cw) {
      const thumbW = Math.max(20, cw * cw / (state.barW * n));
      const thumbX = pad.left + (state.start / n) * cw;
      ctx.fillStyle = '#576574';
      ctx.fillRect(thumbX, sbY, thumbW, sbH);
    }

    if (subCanvas) {
      const sctx = subCanvas.getContext('2d');
      const spad = { top: 12, bottom: 14, left: 60, right: 72 };
      const sch = 110 - spad.top - spad.bottom;
      const s2y = (v, mn, mx) => spad.top + sch - (v - mn) / (mx - mn) * sch;

      // 按可视范围重算 GEX/OI/VR/IV scale，避免远端极端值压扁
      let vMinG = Infinity, vMaxG = -Infinity, vMinS = Infinity, vMaxS = -Infinity, vMinV = Infinity, vMaxV = -Infinity;
      let vMinIv = Infinity, vMaxIv = -Infinity;
      let vMinFv = Infinity, vMaxFv = -Infinity, vMinFoi = Infinity, vMaxFoi = -Infinity; let vMinSk = Infinity, vMaxSk = -Infinity;
      for (let i = start; i < end && i < n; i++) {
        const g = _subGex[i];
        if (g !== 0) { if (g < vMinG) vMinG = g; if (g > vMaxG) vMaxG = g; }
        const sd = _subSkewD[i];
        if (sd !== 0) { if (sd < vMinS) vMinS = sd; if (sd > vMaxS) vMaxS = sd; }
        const vv = _subVr[i];
        if (vv !== 0) { if (vv < vMinV) vMinV = vv; if (vv > vMaxV) vMaxV = vv; }
        const ivv = _subIv[i];
        if (ivv !== 0) { if (ivv < vMinIv) vMinIv = ivv; if (ivv > vMaxIv) vMaxIv = ivv; }
        const fv = _subFutVol[i];
        if (fv !== 0) { if (fv < vMinFv) vMinFv = fv; if (fv > vMaxFv) vMaxFv = fv; }
        const skv = _subSkew[i];
        if (skv !== 0) { if (skv < vMinSk) vMinSk = skv; if (skv > vMaxSk) vMaxSk = skv; }
        const foi = _subFutOi[i];
        if (foi !== 0) { if (foi < vMinFoi) vMinFoi = foi; if (foi > vMaxFoi) vMaxFoi = foi; }
      }
      if (vMinG === Infinity || vMinG === vMaxG) { vMinG = _subMinG; vMaxG = _subMaxG; }
      else { const gr = vMaxG - vMinG || 1; vMinG -= gr * 0.1; vMaxG += gr * 0.1; }
      if (vMinS === Infinity || vMinS === vMaxS) { vMinS = _subMinS; vMaxS = _subMaxS; }
      else { const sr = vMaxS - vMinS || 1; vMinS -= sr * 0.1; vMaxS += sr * 0.1; }
      if (vMinV === Infinity || vMinV === vMaxV) { vMinV = _subMinV; vMaxV = _subMaxV; }
      if (vMinIv === Infinity || vMinIv === vMaxIv) { vMinIv = _subMinIv; vMaxIv = _subMaxIv; }
      if (vMinFv === Infinity || vMinFv === vMaxFv) { vMinFv = _subMinFv; vMaxFv = _subMaxFv; }
      else { const fvr = vMaxFv - vMinFv || 1; vMinFv -= fvr * 0.1; vMaxFv += fvr * 0.1; }
      if (vMinSk === Infinity || vMinSk === vMaxSk) { vMinSk = _subMinSk; vMaxSk = _subMaxSk; }
      else { const skvr = vMaxSk - vMinSk || 1; vMinSk -= skvr * 0.1; vMaxSk += skvr * 0.1; }
      if (vMinFoi === Infinity || vMinFoi === vMaxFoi) { vMinFoi = _subMinFoi; vMaxFoi = _subMaxFoi; }
      else { const foir = vMaxFoi - vMinFoi || 1; vMinFoi -= foir * 0.1; vMaxFoi += foir * 0.1; }

      sctx.fillStyle = '#09131c';
      sctx.fillRect(0, 0, W, 110);

      sctx.strokeStyle = '#1a2a3a';
      sctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = spad.top + (sch / 4) * i;
        sctx.beginPath(); sctx.moveTo(pad.left, y); sctx.lineTo(W - spad.right, y); sctx.stroke();
      }

      const zy = s2y(0, vMinG, vMaxG);
      if (zy >= spad.top && zy <= spad.top + sch) {
        sctx.save();
        sctx.setLineDash([3, 3]);
        sctx.strokeStyle = '#2d3436';
        sctx.lineWidth = 1;
        sctx.beginPath(); sctx.moveTo(pad.left, zy); sctx.lineTo(W - spad.right, zy); sctx.stroke();
        sctx.setLineDash([]);
        sctx.restore();
      }

      if (subVis.gex) {
        sctx.fillStyle = '#576574';
        sctx.font = '10px sans-serif';
        sctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
          const v = vMinG + (vMaxG - vMinG) / 4 * i;
          const y = spad.top + (sch / 4) * (4 - i);
          let label;
          if (Math.abs(v) >= 1e6) label = (v / 1e6).toFixed(1) + 'M';
          else if (Math.abs(v) >= 1e3) label = (v / 1e3).toFixed(0) + 'K';
          else label = v.toFixed(0);
          sctx.fillText(label, pad.left - 4, y + 3);
        }
      }

      if (subVis.skew) {
        sctx.textAlign = 'left';
        for (let i = 0; i <= 4; i++) {
          const v = vMinS + (vMaxS - vMinS) / 4 * i;
          const y = spad.top + (sch / 4) * (4 - i);
          sctx.fillStyle = '#48dbfb';
          sctx.fillText((v * 100).toFixed(1) + '%', W - spad.right + 4, y + 3);
        }
      }

      if (subVis.vr) {
        sctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
          const v = vMinV + (vMaxV - vMinV) / 4 * i;
          const y = spad.top + (sch / 4) * (4 - i);
          sctx.fillStyle = '#ff9f43';
          sctx.fillText(v.toFixed(2), W - 8, y + 3);
        }
      }

      if (subVis.iv) {
        sctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
          const v = vMinIv + (vMaxIv - vMinIv) / 4 * i;
          const y = spad.top + (sch / 4) * (4 - i);
          sctx.fillStyle = '#2ecc71';
          sctx.fillText((v * 100).toFixed(1) + '%', W - 24, y + 3);
        }
      }

      if (subVis.skewVal) {
        sctx.fillStyle = '#576574';
        sctx.font = '10px sans-serif';
        sctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
          const v = vMinSk + (vMaxSk - vMinSk) / 4 * i;
          const y = spad.top + (sch / 4) * (4 - i);
          sctx.fillText((v * 100).toFixed(1) + '%', pad.left - 4, y + 3);
        }
      }

      if (subVis.gex) {
        for (let i = start; i < end && i < n; i++) {
          const g = _subGex[i];
          if (g === 0) continue;
          const x = toX(i);
          const y0 = s2y(0, vMinG, vMaxG);
          const y1 = s2y(g, vMinG, vMaxG);
          const bw = Math.max(1, state.barW * 0.5);
          sctx.fillStyle = g > 0 ? '#5cd85a' : '#ff6b6b';
          sctx.globalAlpha = 0.6;
          sctx.fillRect(x - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0));
          sctx.globalAlpha = 1;
        }
      }

      if (subVis.skewVal) {
        for (let i = start; i < end && i < n; i++) {
          const sv = _subSkew[i];
          if (sv === 0) continue;
          const x = toX(i);
          const y0 = s2y(0, vMinSk, vMaxSk);
          const y1 = s2y(sv, vMinSk, vMaxSk);
          const bw = Math.max(1, state.barW * 0.5);
          sctx.fillStyle = sv > 0 ? '#a55eea' : '#a55eea';
          sctx.globalAlpha = 0.5;
          sctx.fillRect(x - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0));
          sctx.globalAlpha = 1;
        }
      }

      if (subVis.skew) {
        sctx.strokeStyle = '#48dbfb';
        sctx.lineWidth = 1;
        sctx.setLineDash([2, 2]);
        sctx.beginPath();
        started = false;
        for (let i = start; i < end && i < n; i++) {
          const x = toX(i);
          const y = s2y(_subSkewD[i], vMinS, vMaxS);
          if (!started) { sctx.moveTo(x, y); started = true; } else sctx.lineTo(x, y);
        }
        sctx.stroke();
        sctx.setLineDash([]);
      }

      if (subVis.vr) {
        sctx.strokeStyle = '#ff9f43';
        sctx.lineWidth = 1;
        sctx.setLineDash([2, 2]);
        sctx.beginPath();
        started = false;
        for (let i = start; i < end && i < n; i++) {
          const x = toX(i);
          const y = s2y(_subVr[i], vMinV, vMaxV);
          if (!started) { sctx.moveTo(x, y); started = true; } else sctx.lineTo(x, y);
        }
        sctx.stroke();
        sctx.setLineDash([]);
      }

      if (subVis.iv) {
        sctx.strokeStyle = '#2ecc71';
        sctx.lineWidth = 1;
        sctx.setLineDash([4, 3]);
        sctx.beginPath();
        started = false;
        for (let i = start; i < end && i < n; i++) {
          const x = toX(i);
          const y = s2y(_subIv[i], vMinIv, vMaxIv);
          if (_subIv[i] === 0 && !started) continue;
          if (_subIv[i] === 0) { started = false; continue; }
          if (!started) { sctx.moveTo(x, y); started = true; } else sctx.lineTo(x, y);
        }
        sctx.stroke();
        sctx.setLineDash([]);
      }

      if (subVis.futVol) {
        sctx.fillStyle = '#576574';
        sctx.font = '10px sans-serif';
        sctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
          const v = vMinFv + (vMaxFv - vMinFv) / 4 * i;
          const y = spad.top + (sch / 4) * (4 - i);
          let label;
          if (Math.abs(v) >= 1e6) label = (v / 1e6).toFixed(1) + 'M';
          else if (Math.abs(v) >= 1e3) label = (v / 1e3).toFixed(0) + 'K';
          else label = v.toFixed(0);
          sctx.fillText(label, pad.left - 4, y + 3);
        }
        for (let i = start; i < end && i < n; i++) {
          const fv = _subFutVol[i];
          if (fv === 0) continue;
          const x = toX(i);
          const y0 = s2y(0, vMinFv, vMaxFv);
          const y1 = s2y(fv, vMinFv, vMaxFv);
          const bw = Math.max(1, state.barW * 0.5);
          sctx.fillStyle = '#54a0ff';
          sctx.globalAlpha = 0.7;
          sctx.fillRect(x - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0));
          sctx.globalAlpha = 1;
        }
      }

      if (subVis.futOi) {
        sctx.strokeStyle = '#f368e0';
        sctx.lineWidth = 1.5;
        sctx.beginPath();
        started = false;
        for (let i = start; i < end && i < n; i++) {
          const x = toX(i);
          const y = s2y(_subFutOi[i], vMinFoi, vMaxFoi);
          if (_subFutOi[i] === 0 && !started) continue;
          if (_subFutOi[i] === 0) { started = false; continue; }
          if (!started) { sctx.moveTo(x, y); started = true; } else sctx.lineTo(x, y);
        }
        sctx.stroke();
      }

      sctx.font = '10px sans-serif';
      const legY = spad.top + 3;
      function drawLegItem(x, color, label, key) {
        const on = subVis[key];
        sctx.fillStyle = on ? color : '#2d3436';
        sctx.fillRect(x, legY + 4, 10, 10);
        sctx.strokeStyle = '#576574';
        sctx.lineWidth = 1;
        sctx.strokeRect(x, legY + 4, 10, 10);
        if (on) {
          sctx.fillStyle = '#fff';
          sctx.font = 'bold 9px sans-serif';
          sctx.textAlign = 'center';
          sctx.fillText('✓', x + 5, legY + 12);
          sctx.font = '10px sans-serif';
        }
        sctx.textAlign = 'left';
        sctx.fillStyle = on ? '#c8d6e5' : '#576574';
        sctx.fillText(label, x + 14, legY + 13);
      }
      drawLegItem(pad.left + 4, '#a55eea', 'GEX', 'gex');
      drawLegItem(pad.left + 54, '#a55eea', 'OI偏度', 'skewVal');
      drawLegItem(pad.left + 104, '#48dbfb', '偏度差', 'skew');
      drawLegItem(pad.left + 154, '#ff9f43', '量比', 'vr');
      drawLegItem(pad.left + 204, '#2ecc71', 'IV偏度', 'iv');
      drawLegItem(pad.left + 254, '#54a0ff', '期量', 'futVol');
      drawLegItem(pad.left + 304, '#f368e0', '期仓', 'futOi');
      sctx.fillStyle = '#576574';

      if (state.hoverIdx >= start && state.hoverIdx < end) {
        const hx = toX(state.hoverIdx);
        sctx.save();
        sctx.setLineDash([4, 4]);
        sctx.strokeStyle = '#8395a7';
        sctx.lineWidth = 1;
        sctx.beginPath(); sctx.moveTo(hx, spad.top); sctx.lineTo(hx, spad.top + sch); sctx.stroke();
        sctx.setLineDash([]);

        const hi = state.hoverIdx;
        const gv = _subGex[hi];
        const sv = _subSkewD[hi] * 100;
        const vv = _subVr[hi];
        const ivv = _subIv[hi];
        const fvv = _subFutVol[hi];
        const foi = _subFutOi[hi];
        const skv = _subSkew[hi];
        sctx.font = '10px sans-serif';
        sctx.textAlign = 'left';
        let hoverY = spad.top + 14;
        if (subVis.gex) {
          sctx.fillStyle = gv >= 0 ? '#5cd85a' : '#ff6b6b';
          sctx.fillText('GEX: ' + (gv >= 0 ? '+' : '') + gv.toLocaleString('zh-CN',{maximumFractionDigits:0}), hx + 4, hoverY);
          hoverY += 12;
        }
        if (subVis.skew) {
          sctx.fillStyle = '#48dbfb';
          sctx.fillText((sv > 0 ? '+' : '') + sv.toFixed(1) + '%', hx + 4, hoverY);
          hoverY += 12;
        }
        if (subVis.vr) {
          sctx.fillStyle = '#ff9f43';
          sctx.fillText('VR:' + vv.toFixed(2), hx + 4, hoverY);
          hoverY += 12;
        }
        if (subVis.iv) {
          sctx.fillStyle = '#2ecc71';
          sctx.fillText('IV偏度: ' + (ivv >= 0 ? '+' : '') + (ivv * 100).toFixed(2) + '%', hx + 4, hoverY);
          hoverY += 12;
        }
        if (subVis.skewVal) {
          sctx.fillStyle = '#a55eea';
          sctx.fillText('OI偏度: ' + (skv >= 0 ? '+' : '') + (skv * 100).toFixed(1) + '%', hx + 4, hoverY);
          hoverY += 12;
        }
        if (subVis.futVol) {
          sctx.fillStyle = '#54a0ff';
          sctx.fillText('期货成交量: ' + fvv.toLocaleString('zh-CN',{maximumFractionDigits:0}), hx + 4, hoverY);
          hoverY += 12;
        }
        if (subVis.futOi) {
          sctx.fillStyle = '#f368e0';
          sctx.fillText('期货持仓量: ' + foi.toLocaleString('zh-CN',{maximumFractionDigits:0}), hx + 4, hoverY);
          hoverY += 12;
        }
        sctx.restore();
      }
    }

    // ── OI 分布图 ──
    const oiCanvas = document.getElementById('oiChart');
    if (oiCanvas) {
      const oiHint = document.getElementById('oiHint');
      if (oiHint) oiHint.style.display = 'none';
      const oiW = W, oiH = 90;
      oiCanvas.width = oiW * dpr;
      oiCanvas.height = oiH * dpr;
      oiCanvas.style.width = oiW + 'px';
      oiCanvas.style.height = oiH + 'px';
      const ox = oiCanvas.getContext('2d');
      ox.scale(dpr, dpr);
      ox.fillStyle = '#0a1628';
      ox.fillRect(0, 0, oiW, oiH);
      const hi = state.hoverIdx;
      if (hi >= 0 && hi < n) {
        const r = data[hi];
        const ocStr = r.oc_chain;
        if (ocStr) {
          let chain;
          try { chain = JSON.parse(ocStr); } catch(e) { chain = null; }
          _oiChain = chain;
          if (chain && chain.length > 0) {
            const px = r.c;
            // 资金集中区：call+put OI 最大的行权价
            let peakS = chain[0].s, peakOi = chain[0].co + chain[0].po;
            chain.forEach(it => { const tot = it.co + it.po; if (tot > peakOi) { peakOi = tot; peakS = it.s; } });
            // 痛点预期亏损：价格落在MP时多头的总亏损
            let mpLoss = 0;
            const mp = r.mp;
            chain.forEach(it => {
              if (it.s < mp) mpLoss += (mp - it.s) * it.co;
              if (it.s > mp) mpLoss += (it.s - mp) * it.po;
            });
            if (oiHint) {
              oiHint.style.display = 'block';
              oiHint.innerHTML = '<span style="color:#5cd85a">绿=看涨OI</span> <span style="color:#ff6b6b">红=看跌OI</span> <span style="color:#e8c84a">黄=现价' + px + '</span> <span style="color:#a29bfe">紫=痛点' + mp + '</span> 最高柱=' + peakS + ' (' + peakOi.toLocaleString() + '手) 痛点预期收获权利金' + (mpLoss >= 10000 ? (mpLoss/10000).toFixed(0) + '万' : mpLoss.toFixed(0));
            }
            let maxOi = 0;
            chain.forEach(it => { if (it.co > maxOi) maxOi = it.co; if (it.po > maxOi) maxOi = it.po; });
            const opad = { top: 8, bottom: 20, left: 8, right: 8 };
            const ocw = oiW - opad.left - opad.right;
            const och = oiH - opad.top - opad.bottom;
            const midY = opad.top + och / 2;
            const minS = chain[0].s, maxS = chain[chain.length - 1].s, sRange = maxS - minS || 1;
            const s2x = (s) => opad.left + (s - minS) / sRange * ocw;
            // 基线
            ox.strokeStyle = '#2d3436'; ox.lineWidth = 1;
            ox.beginPath(); ox.moveTo(opad.left, midY); ox.lineTo(oiW - opad.right, midY); ox.stroke();
            // 现价线
            ox.strokeStyle = '#e8c84a'; ox.lineWidth = 1; ox.setLineDash([3, 3]);
            const pxx = s2x(px);
            ox.beginPath(); ox.moveTo(pxx, opad.top); ox.lineTo(pxx, opad.top + och); ox.stroke();
            ox.setLineDash([]);
            // MP 线
            if (mp && mp >= minS && mp <= maxS) {
              const mpx = s2x(mp);
              ox.strokeStyle = '#a29bfe'; ox.lineWidth = 1.5; ox.setLineDash([5, 3]);
              ox.beginPath(); ox.moveTo(mpx, opad.top); ox.lineTo(mpx, opad.top + och); ox.stroke();
              ox.setLineDash([]);
            }
            // 柱子
            const barW = Math.max(2, ocw / chain.length * 0.6);
            chain.forEach(it => {
              const bx = s2x(it.s);
              if (it.co > 0) {
                const bh = (it.co / maxOi) * (och / 2);
                ox.fillStyle = 'rgba(92,216,90,0.55)';
                ox.fillRect(bx - barW/2, midY - bh, barW, bh);
              }
              if (it.po > 0) {
                const bh = (it.po / maxOi) * (och / 2);
                ox.fillStyle = 'rgba(255,107,107,0.55)';
                ox.fillRect(bx - barW/2, midY, barW, bh);
              }
            });
            // 行权价标签
            ox.fillStyle = '#576574'; ox.font = '9px sans-serif'; ox.textAlign = 'center';
            const sStep = Math.max(1, Math.floor(chain.length / 10));
            for (let i = 0; i < chain.length; i += sStep) {
              ox.fillText(chain[i].s, s2x(chain[i].s), oiH - 6);
            }
            // 右下角标注
            ox.textAlign = 'right'; ox.fillStyle = '#576574'; ox.font = '9px sans-serif';
            ox.fillText('现价 ' + px, oiW - 8, oiH - 6);
            // OI 图悬停提示：行权价与持仓量
            if (_oiHoverIdx >= 0 && _oiHoverIdx < chain.length) {
              const hc = chain[_oiHoverIdx];
              const hx2 = s2x(hc.s);
              ox.save();
              // 高亮竖线
              ox.strokeStyle = 'rgba(255,255,255,0.15)';
              ox.lineWidth = 1;
              ox.setLineDash([2, 2]);
              ox.beginPath(); ox.moveTo(hx2, opad.top); ox.lineTo(hx2, opad.top + och); ox.stroke();
              ox.setLineDash([]);
              // 提示标签
              const lbl = hc.s + '  Call:' + hc.co.toLocaleString() + '  Put:' + hc.po.toLocaleString() + '  合计:' + (hc.co+hc.po).toLocaleString();
              ox.font = '10px sans-serif';
              const tw = ox.measureText(lbl).width;
              let lx = hx2 - tw/2 - 6;
              if (lx < 2) lx = 2;
              if (lx + tw + 12 > oiW - 2) lx = oiW - tw - 14;
              ox.fillStyle = 'rgba(10,22,40,0.85)';
              ox.fillRect(lx, 2, tw + 12, 18);
              ox.strokeStyle = '#576574';
              ox.lineWidth = 1;
              ox.strokeRect(lx, 2, tw + 12, 18);
              ox.fillStyle = '#fff';
              ox.textAlign = 'left';
              ox.fillText(lbl, lx + 6, 14);
              ox.restore();
            }
          } else {
            _oiChain = null; _oiHoverIdx = -1;
            if (oiHint) oiHint.style.display = 'none';
          }
        } else {
          _oiChain = null; _oiHoverIdx = -1;
          if (oiHint) oiHint.style.display = 'none';
        }
      } else {
        _oiChain = null; _oiHoverIdx = -1;
    }
  }
}

  function getDataX(clientX) {
    const br = canvas.getBoundingClientRect();
    return clientX - br.left;
  }

  function getBarIdx(clientX) {
    const mx = getDataX(clientX);
    return Math.round(state.start + (mx - pad.left) / state.barW);
  }

  canvas.onmousedown = (e) => {
    state.dragging = true;
    state.didDrag = false;
    state.dragStartX = getDataX(e.clientX);
    state.dragStartIdx = state.start;
    canvas.style.cursor = 'grabbing';
  };
  canvas.onclick = (e) => {
    if (!state.didDrag) {
      state.pinned = !state.pinned;
      state.pinnedIdx = state.pinned ? state.hoverIdx : -1;
      render();
    }
  };

  canvas.onmousemove = (e) => {
    const idx = getBarIdx(e.clientX);
    if (state.dragging) {
      state.didDrag = true;
      const dx = getDataX(e.clientX) - state.dragStartX;
      state.start = Math.max(0, Math.min(n - getVisibleCount() + 60, state.dragStartIdx - dx / state.barW));
      if (!state.renderPending) { state.renderPending = true; requestAnimationFrame(function() { state.renderPending = false; render(); }); }
    } else {
      if (!state.pinned && idx !== state.hoverIdx) {
        state.hoverIdx = idx;
        updateInfo(idx);
        render();
      }
      canvas.style.cursor = 'crosshair';
    }
  };

  window.addEventListener('mouseup', function() {
    if (state.dragging) { state.dragging = false; }
  });

  canvas.onmouseleave = function() {
    // 移到子图/外部不清除选中，保留上次悬停位置
  };

  canvas.onwheel = (e) => {
    e.preventDefault();
    const mx = getDataX(e.clientX);
    const idxUnderMouse = state.start + mx / state.barW;
    const zoom = e.deltaY > 0 ? 0.85 : 1.18;
    const newBarW = Math.max(2, Math.min(40, state.barW * zoom));
    state.start = Math.max(0, Math.min(n - Math.ceil(cw / newBarW) + 60, idxUnderMouse - mx / newBarW));
    state.barW = newBarW;
    render();
  };

  // 触屏支持：单指拖动 + 双指缩放，阻止页面缩放
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (e.touches.length === 1) {
      const touch = e.touches[0];
      state.dragStartX = getDataX(touch.clientX);
      state.dragStartIdx = state.start;
      state.dragging = true;
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      state.pinchDist = Math.sqrt(dx * dx + dy * dy);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 1 && state.dragging) {
      const touch = e.touches[0];
      const dx = getDataX(touch.clientX) - state.dragStartX;
      state.start = Math.max(0, Math.min(n - getVisibleCount() + 60, state.dragStartIdx - dx / state.barW));
      if (!state.renderPending) { state.renderPending = true; requestAnimationFrame(function() { state.renderPending = false; render(); }); }
      if (!state.pinned) {
        const idx = getBarIdx(touch.clientX);
        if (idx !== state.hoverIdx) {
          state.hoverIdx = idx;
          updateInfo(idx);
        }
      }
    } else if (e.touches.length === 2 && state.pinchDist > 0) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const scale = dist / state.pinchDist;
      const br = canvas.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - br.left;
      const idxUnderMouse = state.start + mx / state.barW;
      const newBarW = Math.max(2, Math.min(40, state.barW * scale));
      state.start = Math.max(0, Math.min(n - Math.ceil(cw / newBarW) + 60, idxUnderMouse - mx / newBarW));
      state.barW = newBarW;
      state.pinchDist = dist;
      if (!state.renderPending) { state.renderPending = true; requestAnimationFrame(function() { state.renderPending = false; render(); }); }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (e.touches.length < 2) state.pinchDist = 0;
    if (e.touches.length === 0) state.dragging = false;
  }, { passive: false });

  if (subCanvas) {
    subCanvas.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
    subCanvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (state.pinned) return;
      const touch = e.touches[0];
      const br = subCanvas.getBoundingClientRect();
      const sx = touch.clientX - br.left;
      const idx = Math.round(state.start + (sx - pad.left) / state.barW);
      if (idx !== state.hoverIdx) {
        state.hoverIdx = idx;
        updateInfo(idx);
        render();
      }
    }, { passive: false });
    subCanvas.addEventListener('touchend', function(e) {
      e.preventDefault();
      const touch = e.changedTouches[0];
      const br = subCanvas.getBoundingClientRect();
      const cx = touch.clientX - br.left;
      const cy = touch.clientY - br.top;
      const spad = { top: 12, bottom: 14, left: 60, right: 72 };
      if (cy >= spad.top + 1 && cy <= spad.top + 22) {
        const relX = cx - (pad.left + 4);
        if (relX >= 0 && relX < 50) subVis.gex = !subVis.gex;
        else if (relX >= 50 && relX < 100) subVis.skewVal = !subVis.skewVal;
        else if (relX >= 100 && relX < 150) subVis.skew = !subVis.skew;
        else if (relX >= 150 && relX < 200) subVis.vr = !subVis.vr;
        else if (relX >= 200 && relX < 250) subVis.iv = !subVis.iv;
        else if (relX >= 250 && relX < 300) subVis.futVol = !subVis.futVol;
        else if (relX >= 300 && relX < 350) subVis.futOi = !subVis.futOi;
        else return;
        render();
      }
    }, { passive: false });
    subCanvas.addEventListener('click', function(e) {
      const br = subCanvas.getBoundingClientRect();
      const cx = e.clientX - br.left;
      const cy = e.clientY - br.top;
      const spad = { top: 12, bottom: 14, left: 60, right: 72 };
      if (cy >= spad.top + 1 && cy <= spad.top + 22) {
        const relX = cx - (pad.left + 4);
        if (relX >= 0 && relX < 50) subVis.gex = !subVis.gex;
        else if (relX >= 50 && relX < 100) subVis.skewVal = !subVis.skewVal;
        else if (relX >= 100 && relX < 150) subVis.skew = !subVis.skew;
        else if (relX >= 150 && relX < 200) subVis.vr = !subVis.vr;
        else if (relX >= 200 && relX < 250) subVis.iv = !subVis.iv;
        else if (relX >= 250 && relX < 300) subVis.futVol = !subVis.futVol;
        else if (relX >= 300 && relX < 350) subVis.futOi = !subVis.futOi;
        else return;
        render();
      }
    });
  }

  // OI 图悬停：显示行权价和持仓量
  const oiEl = document.getElementById('oiChart');
  if (oiEl) {
    let _oiMoved = false;
    oiEl.addEventListener('touchstart', function(e) { e.preventDefault(); _oiMoved = false; }, { passive: false });
    oiEl.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (state.pinned) return;
      _oiMoved = true;
      const touch = e.touches[0];
      const br = oiEl.getBoundingClientRect();
      const sx = touch.clientX - br.left;
      _oiHoverAt(sx);
    }, { passive: false });
    oiEl.addEventListener('touchend', function(e) {
      if (!_oiMoved && !state.pinned) {
        // 轻点 OI 图：切换主图锁定
        state.pinned = !state.pinned;
        state.pinnedIdx = state.pinned ? state.hoverIdx : -1;
      }
      render();
    });
    oiEl.addEventListener('mousemove', function(e) {
      if (state.pinned) return;
      const br = oiEl.getBoundingClientRect();
      const mx = e.clientX - br.left;
      _oiHoverAt(mx);
    });
    oiEl.addEventListener('mouseleave', function() {
      if (_oiHoverIdx >= 0) {
        _oiHoverIdx = -1;
        render();
      }
    });
  }

  function _oiHoverAt(mx) {
    const oiw = W;
    const opad2 = { top: 8, bottom: 20, left: 8, right: 8 };
    const ocw = oiw - opad2.left - opad2.right;
    if (!_oiChain || _oiChain.length < 2) return;
    const minS2 = _oiChain[0].s, maxS2 = _oiChain[_oiChain.length - 1].s, sRange2 = maxS2 - minS2 || 1;
    const strike = minS2 + (mx - opad2.left) / ocw * sRange2;
    let best = 0, bestDist = Infinity;
    for (let i = 0; i < _oiChain.length; i++) {
      const d = Math.abs(_oiChain[i].s - strike);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    if (best !== _oiHoverIdx) {
      _oiHoverIdx = best;
      render();
    }
  }

  window._chartRender = render;
  render();
}

function toggleChartLine() {
  if (window._chartRender) window._chartRender();
}

function drawEquityCurve(eqCurve, cap) {
  const canvas = document.getElementById('eqChart');
  if (!canvas || !eqCurve || eqCurve.length < 2) return;
  if (!canvas._eqData) canvas._eqData = { hoverIdx: -1, curve: [], cap: 0 };
  const data = canvas._eqData;
  data.curve = eqCurve;
  data.cap = cap;

  const W = canvas.clientWidth || 600;
  const H = 200;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const pad = { top: 20, right: 16, bottom: 28, left: 70 };
  const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;

  function renderCurve(hoverIdx) {
    const curve = data.curve;
    const _cap = data.cap;
    let min = _cap, max = _cap;
    for (const p of curve) { if (p.eq < min) min = p.eq; if (p.eq > max) max = p.eq; }
    const rng = max - min || 1; min -= rng * 0.05; max += rng * 0.05;
    const toX = i => pad.left + i / (curve.length - 1) * cw;
    const toY = v => pad.top + ch - (v - min) / (max - min) * ch;

    ctx.fillStyle = '#0f1923'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#1a2a3a'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const y = pad.top + (ch / 4) * i; ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke(); }
    ctx.fillStyle = '#576574'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) ctx.fillText(Math.round(max - (rng / 4) * i).toLocaleString(), pad.left - 6, pad.top + (ch / 4) * i + 4);
    ctx.strokeStyle = '#8395a7'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    const capY = toY(_cap); ctx.beginPath(); ctx.moveTo(pad.left, capY); ctx.lineTo(W - pad.right, capY); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#8395a7'; ctx.textAlign = 'left'; ctx.font = '10px sans-serif'; ctx.fillText('本金', W - pad.right - 30, capY - 3);
    const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
    grad.addColorStop(0, 'rgba(84, 160, 255, 0.12)'); grad.addColorStop(1, 'rgba(84, 160, 255, 0.01)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(toX(0), toY(curve[0].eq));
    for (let i = 1; i < curve.length; i++) ctx.lineTo(toX(i), toY(curve[i].eq));
    ctx.lineTo(toX(curve.length - 1), pad.top + ch); ctx.lineTo(toX(0), pad.top + ch); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#54a0ff'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i < curve.length; i++) { const x = toX(i), y = toY(curve[i].eq); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.fillStyle = '#576574'; ctx.textAlign = 'center'; ctx.font = '10px sans-serif';
    for (const di of [0, Math.floor(curve.length / 2), curve.length - 1]) ctx.fillText(curve[di].d, toX(di), pad.top + ch + 16);
    const last = curve[curve.length - 1].eq;
    ctx.fillStyle = '#54a0ff'; ctx.textAlign = 'right'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(Math.round(last).toLocaleString(), W - pad.right, pad.top - 4);
    ctx.fillStyle = '#8395a7'; ctx.font = '11px sans-serif';
    ctx.fillText((last / _cap - 1 > 0 ? '+' : '') + (last / _cap - 1).toFixed(1) + '%', W - pad.right, pad.top + 10);

    if (hoverIdx >= 0 && hoverIdx < curve.length) {
      const p = curve[hoverIdx];
      const hx = toX(hoverIdx), hy = toY(p.eq);
      ctx.save();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = 'rgba(200, 214, 229, 0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(hx, pad.top); ctx.lineTo(hx, pad.top + ch); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad.left, hy); ctx.lineTo(W - pad.right, hy); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      ctx.fillStyle = '#1a2a3a'; ctx.fillRect(hx - 40, pad.top + ch + 2, 80, 18);
      ctx.fillStyle = '#c8d6e5'; ctx.textAlign = 'center'; ctx.font = '10px sans-serif';
      ctx.fillText(p.d, hx, pad.top + ch + 15);
      const eqText = Math.round(p.eq).toLocaleString();
      const eqW = ctx.measureText(eqText).width + 14;
      ctx.fillStyle = '#1a2a3a'; ctx.fillRect(W - pad.right - eqW, hy - 9, eqW, 18);
      ctx.fillStyle = '#54a0ff'; ctx.textAlign = 'right'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText(eqText, W - pad.right - 5, hy + 5);
    }
  }

  renderCurve(-1);

  if (!canvas._eqBound) {
    canvas._eqBound = true;
    canvas.addEventListener('mousemove', function(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left - pad.left;
      const curve = data.curve;
      const idx = Math.round(mx / cw * (curve.length - 1));
      data.hoverIdx = Math.max(0, Math.min(curve.length - 1, idx));
      renderCurve(data.hoverIdx);
    });
    canvas.addEventListener('mouseleave', function() {
      data.hoverIdx = -1;
      renderCurve(-1);
    });
  }
}

window.onload = async function() {
  const ok = await loadAllData();
  if (ok) {
    const sym = document.getElementById('symbol').value;
    if (!await loadParams(sym)) setParamValues(defaultParams);
    const d = ALL_DATA[sym];
    if (d) {
      document.getElementById('p_start').value = d[0].d;
      document.getElementById('p_end').value = new Date().toISOString().slice(0, 10);
    }
    runBacktest();
  }
};
